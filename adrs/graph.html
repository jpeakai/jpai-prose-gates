<script id="record-data" type="application/json">{"PRS-0001":{"file":"0001-parse-once-to-mdast.md","status":"accepted","title":"Every rule reads one mdast tree parsed once per file","markdown":"<!-- GENERATED from PRS-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Markdown is a grammar, not a line format.\n> A rule that guesses structure from lines disagrees with every renderer sooner or later.\n\n## Relates to\n\n- Depended on by [PRS-0012](0012-node-runs-a-published-bundle.md) (the Node bundle inlines the same parser)\n- Depended on by [PRS-0003](0003-splice-source-never-restringify.md) (splicing addresses source through the tree offsets)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the shared rule context derives from the model parsed once)\n\n## Problem\n\n### Symptom\n\nEach rule decided for itself what counted as code, a table or a list. The answers drifted between rules.\n\n### Pain point\n\nA finding inside inline code, a link url or a table cell was a false positive that no single fix could remove.\n\n## Decision\n\n### The lens\n\n- **Given**: several rules need to know which bytes are prose and which are structure\n- **We prefer**: parsing each file once with micromark into mdast and handing every rule the same model, over per-rule line scanning\n- **Because**: the parser already implements CommonMark and GFM exactly, so exemptions come from node types rather than heuristics\n- **Unless**: a rule needs something the tree loses, such as the original spacing, in which case it reads the source through node offsets\n\n### In practice\n\n- A rule reads text nodes, paragraph views and offsets from DocModel.\n- Code, inline code, html and link urls are exempt because they are never text nodes.\n- Source positions come from the tree, so a finding points at the real line.\n\n## Consequences\n\n### Pros\n\n- Exemptions are consistent across every rule.\n- A new rule starts from structure rather than rebuilding it.\n\n### Cons\n\n- The package depends on the unified parser family.\n- A rule must map tree positions back to source offsets to edit anything.\n"},"PRS-0002":{"file":"0002-generated-markdown-is-gated.md","status":"accepted","title":"Generated markdown is gated like hand-written markdown","markdown":"<!-- GENERATED from PRS-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A reader cannot tell which page was generated.\n> Slop in rendered output reads exactly like slop written by hand.\n\n## Problem\n\n### Symptom\n\nGenerated files were excluded from the gates because nobody may edit them.\n\n### Pain point\n\nThe slop moved into records and templates, where the gates never looked.\n\n## Decision\n\n### The lens\n\n- **Given**: a markdown file is produced by rendering a record or a template\n- **We prefer**: gating the rendered output and tracing each finding back to its source, over exempting generated paths\n- **Because**: the reader sees the rendered page, so that page is what must meet the standard\n- **Unless**: the generator's own boilerplate trips a rule, in which case the template is fixed rather than the rule relaxed\n\n### In practice\n\n- Consumers pass adrs/*.md to the gates with every other markdown file.\n- A finding in generated output is fixed in the record or the template.\n- The fixer is never run over generated files, since the next render would undo it.\n\n## Consequences\n\n### Pros\n\n- The standard holds on every page a reader can open.\n- Template defects surface once and are fixed once.\n\n### Cons\n\n- A finding points at a file the contributor must not edit.\n"},"PRS-0003":{"file":"0003-splice-source-never-restringify.md","status":"accepted","title":"Fixes splice source slices and never re-stringify the tree","markdown":"<!-- GENERATED from PRS-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A formatter owns every byte it prints.\n> A gate that fixes one rule has no business changing the author's emphasis markers, escapes or table padding.\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (slices are addressed through the offsets the parsed tree supplies)\n- Depended on by [PRS-0005](0005-every-fix-is-verified.md) (one spliced range is cheap to verify)\n\n## Problem\n\n### Symptom\n\nSerialising the tree normalises the whole file, so a one-word fix produced a diff across every line.\n\n### Pain point\n\nA contributor could not review the fix, and the rewrite fought every other formatter in the repo.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule wants to change a small part of a document\n- **We prefer**: splicing a replacement built from source slices into the original text, over editing the tree and stringifying it\n- **Because**: every byte outside the edit is preserved by construction, so the diff is exactly the fix\n- **Unless**: no source slice can express the change, in which case the rule refuses rather than generating markup\n\n### In practice\n\n- An edit carries a start offset, an end offset and replacement text.\n- Links, emphasis, escapes and code spans travel inside slices unchanged.\n- The only generated markup is list markers, a lead-in colon and line breaks.\n\n## Consequences\n\n### Pros\n\n- Fix diffs are minimal and reviewable.\n- The fixer coexists with any other markdown formatter.\n\n### Cons\n\n- Each fixer must reason about offsets, escapes and line endings itself.\n- Overlapping edits cannot be combined and must wait for the next pass.\n"},"PRS-0004":{"file":"0004-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the input is ambiguous","markdown":"<!-- GENERATED from PRS-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A wrong autofix is worse than no autofix.\n> The finding still asks a human, while a silent rewrite changes meaning nobody reviewed.\n\n## Relates to\n\n- Extended by [PRS-0005](0005-every-fix-is-verified.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0007](0007-em-dash-becomes-parentheses-or-colon.md) (the em-dash fixer refuses every shape outside two)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (the refuses helper asserts untouched output)\n\n## Problem\n\n### Symptom\n\nHeuristics that looked right on typical prose rewrote paired cross-references into a numbered list.\n\n### Pain point\n\nThe fix passed every gate, so the changed meaning shipped without anyone reading it.\n\n## Decision\n\n### The lens\n\n- **Given**: a fixer cannot be sure its rewrite keeps the author's meaning\n- **We prefer**: refusing and leaving the finding reported, over applying the most likely rewrite\n- **Because**: the check still fails, so a human sees the case, while a wrong fix hides it permanently\n- **Unless**: never\n\n### In practice\n\n- Escapes, hard breaks, tables, blockquotes and mixed marker families make a fixer refuse.\n- A refusal is a normal outcome, reported as a remaining finding.\n- Every new refusal condition comes with an adversarial test.\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff line by line.\n\n### Cons\n\n- Some fixable prose stays reported until a human edits it.\n"},"PRS-0005":{"file":"0005-every-fix-is-verified.md","status":"accepted","title":"Every fix is verified against a content fingerprint and an expected shape","markdown":"<!-- GENERATED from PRS-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A fixer is a heuristic, and heuristics have bugs.\n> The engine checks the result instead of trusting the rule that produced it.\n\n## Relates to\n\n- Depends on [PRS-0003](0003-splice-source-never-restringify.md) (verification is cheap because an edit is a single spliced range)\n- Extends [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0006](0006-sentence-length-is-never-autofixed.md) (a length fix would change the fingerprint)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (properties assert the fingerprint is preserved)\n\n## Problem\n\n### Symptom\n\nA fixer bug could drop a word, create emphasis from a stray asterisk, or split one paragraph into two.\n\n### Pain point\n\nThe damage looked like formatting, so nothing downstream noticed it.\n\n## Decision\n\n### The lens\n\n- **Given**: an edit is about to be written back to a file\n- **We prefer**: reparsing the result and comparing its words, urls and code to the original, over trusting the fixer's own logic\n- **Because**: a changed fingerprint is a tool bug that must fail loudly, while a shape mismatch is an unforeseen case\n- **Unless**: never\n\n### In practice\n\n- The fingerprint is every word, url, alt text and code value in order, ignoring enumeration markers and joining conjunctions.\n- A changed fingerprint throws FixInvariantError, which fails the run.\n- Each edit declares same-tree, same-shape or replace-paragraph, and a mismatch refuses that edit.\n- Fixes run to a fixpoint in a fixed rule order, one verified pass at a time.\n\n## Consequences\n\n### Pros\n\n- A fixer bug surfaces as a crash instead of a silent content change.\n\n### Cons\n\n- Every edit costs a reparse of the document.\n- The fingerprint must know which tokens a fix may legitimately remove.\n"},"PRS-0006":{"file":"0006-sentence-length-is-never-autofixed.md","status":"accepted","title":"Sentence length is reported and never autofixed","markdown":"<!-- GENERATED from PRS-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Every other rule changes punctuation or layout.\n> Shortening a sentence means choosing what to cut, and that choice belongs to the author.\n\n## Relates to\n\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint forbids the word changes a length fix would need)\n- Extended by [PRS-0010](0010-length-findings-guide-a-split.md) (the message estimates clauses to guide a split)\n\n## Problem\n\n### Symptom\n\nSplitting a long sentence mechanically at a comma produces fragments, and cutting clauses drops content.\n\n### Pain point\n\nEither rewrite changes what the author said, which no gate is entitled to do.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence exceeds the word budget\n- **We prefer**: reporting the finding for a human to rewrite, over any mechanical split or trim\n- **Because**: every shortening changes words, and the fingerprint rightly rejects any fix that changes words\n- **Unless**: never\n\n### In practice\n\n- PG002 findings survive a fix run unchanged.\n- The budget is tuned with the max-words flag rather than by relaxing the rule.\n\n## Consequences\n\n### Pros\n\n- The fixer never rewrites meaning.\n\n### Cons\n\n- A fix run can finish with findings left, so CI still fails until a human edits.\n"},"PRS-0007":{"file":"0007-em-dash-becomes-parentheses-or-colon.md","status":"accepted","title":"An em-dash pair becomes parentheses and a lone em-dash becomes a colon","markdown":"<!-- GENERATED from PRS-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Two dashes in one sentence almost always bracket an aside.\n> One dash almost always introduces what follows.\n\n## Relates to\n\n- Depends on [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (every pattern outside the two shapes is refused)\n\n## Problem\n\n### Symptom\n\nEm-dashes are the most common slop glyph, and reporting each one made fix runs noisy.\n\n### Pain point\n\nThe right replacement depends on how many dashes a sentence holds, which a human decides the same way every time.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence in prose contains an em-dash\n- **We prefer**: replacing a pair with parentheses and a single dash with a colon, over reporting every dash for a manual rewrite\n- **Because**: those two shapes have one reading each, so the replacement keeps the meaning\n- **Unless**: the dash touches punctuation, sits between digits, shares a sentence with a colon, or brackets a marker\n\n### In practice\n\n- `Bun \u2014 the runtime \u2014 is fast` becomes `Bun (the runtime) is fast`.\n- `One rule \u2014 no dashes` becomes `One rule: no dashes`.\n- Three or more dashes in one sentence are refused.\n- HTML entities are reported but never decoded.\n\n## Consequences\n\n### Pros\n\n- The most common glyph finding clears without a human.\n\n### Cons\n\n- The rule carries a growing list of refusal conditions.\n"},"PRS-0008":{"file":"0008-one-file-per-rule.md","status":"accepted","title":"Each rule lives in its own file with its check and its fix together","markdown":"<!-- GENERATED from PRS-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A rule's check and fix must agree on what counts as a finding.\n> Keeping them side by side makes a disagreement visible in one diff.\n\n## Relates to\n\n- Extended by [PRS-0011](0011-rules-carry-a-category.md) (rules also carry a category, as a field rather than a folder)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context is what a rule module receives in both halves)\n- Depended on by [PRS-0016](0016-a-shared-helper-sits-on-its-own-side.md) (a helper leaves a rule module only once a second rule needs it)\n- Depended on by [PRS-0017](0017-modules-group-by-what-a-function-takes.md) (a helper leaves its rule module for the layer whose data it takes)\n\n## Problem\n\n### Symptom\n\nAll nine rules and the CLI shared one file, so any change touched everything.\n\n### Pain point\n\nAdding fixers would have doubled the file, and shared helpers were impossible to test alone.\n\n## Decision\n\n### The lens\n\n- **Given**: the package holds several independent rules that each gain a fixer\n- **We prefer**: one module per rule named by id and slug, with shared machinery in src/fix, over grouping rules by theme in larger files\n- **Because**: the rule id is how findings, tests and fixtures are named, so the file tree mirrors it\n- **Unless**: two rules share a detector, in which case the detector moves to its own module, as interpunct.ts does\n\n### In practice\n\n- A rule file is named pgNNN-slug.ts.\n- A fixture directory is named after the rule id it exercises.\n- src/bin.ts holds the process glue, so tests import cli.ts without exiting.\n\n## Consequences\n\n### Pros\n\n- A rule and its tests can be read without the rest of the package.\n\n### Cons\n\n- Fix ordering lives in the engine, away from the rules it orders.\n"},"PRS-0009":{"file":"0009-adversarial-and-property-tests-gate-fixes.md","status":"accepted","title":"Adversarial and property tests gate every change to fix behaviour","markdown":"<!-- GENERATED from PRS-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Example tests show a fixer works on the cases its author imagined.\n> The bugs live in the cases nobody imagined.\n\n## Relates to\n\n- Tests [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the refuses helper asserts untouched output)\n- Tests [PRS-0005](0005-every-fix-is-verified.md) (properties assert the fingerprint is preserved)\n\n## Problem\n\n### Symptom\n\nEach fixer passed its happy-path fixtures while rewriting escapes, CRLF files and cross-references wrongly.\n\n### Pain point\n\nThose failures change meaning in real documents, so they cannot wait for a user report.\n\n## Decision\n\n### The lens\n\n- **Given**: a change touches how any rule fixes prose\n- **We prefer**: exact fixtures, adversarial suites and generated property tests together, over example tests alone\n- **Because**: each layer catches a class of bug the others miss, and a regression becomes a named test\n- **Unless**: never\n\n### In practice\n\n- A found bug gets an adversarial test before its fix.\n- Properties assert no throw, idempotence, a kept fingerprint, no new findings and byte-identical fences.\n- Tests use the real parser and real files, never mocks.\n\n## Consequences\n\n### Pros\n\n- A fixer bug usually fails a property before it reaches a document.\n\n### Cons\n\n- The suite is slower than example tests alone.\n- A property counterexample can take time to shrink into a readable test.\n"},"PRS-0010":{"file":"0010-length-findings-guide-a-split.md","status":"accepted","title":"A sentence length finding estimates clauses to guide a split","markdown":"<!-- GENERATED from PRS-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A finding is also an instruction.\n> An agent told only that a sentence is too long cuts words until it fits, and the result reads like a telegram.\n\n## Relates to\n\n- Extends [PRS-0006](0006-sentence-length-is-never-autofixed.md) (the rule stays report-only, and its message now carries the guidance a human or agent needs)\n\n## Problem\n\n### Symptom\n\nA PG002 message gave only a word count and a budget.\n\n### Pain point\n\nThe cheapest way to meet a word budget is to delete words, so rewrites lost articles, connectives and meaning.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence exceeds the word budget and a human or an agent must rewrite it\n- **We prefer**: reporting potential clauses and a target sentence count, over reporting the word count alone\n- **Because**: a count of clauses names where the sentence can split, which makes splitting easier than compressing\n- **Unless**: a real parser becomes deterministic enough to replace the heuristic, which would supersede the counting method only\n\n### In practice\n\n- A clause boundary is a semicolon or colon with text after it, a comma before a coordinating conjunction, or a subordinating word.\n- The target is the largest of two, the clause count and the word count divided by the budget.\n- The count is labelled potential, because an Oxford comma in a list also reads as a boundary.\n\n## Consequences\n\n### Pros\n\n- Rewrites keep their connective words and read as prose.\n- The message stays deterministic, with no model or dependency.\n\n### Cons\n\n- The heuristic overcounts lists and undercounts clauses joined without a marker word.\n"},"PRS-0011":{"file":"0011-rules-carry-a-category.md","status":"accepted","title":"Each rule carries a category, and RULES.md is held true by a test","markdown":"<!-- GENERATED from PRS-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Nine rule ids say nothing about which rules share a purpose.\n> Five of them promote a hidden list, and a reader should see that at a glance.\n\n## Relates to\n\n- Extends [PRS-0008](0008-one-file-per-rule.md) (a category is a field on the rule module, never a folder, so files stay named by rule id)\n\n## Problem\n\n### Symptom\n\nThe README listed nine rules in id order with a one-line fix each.\n\n### Pain point\n\nA one-line summary cannot show what a fix writes, and a hand-written example drifts from the code.\n\n## Decision\n\n### The lens\n\n- **Given**: rules need grouping and each fix needs a concrete example\n- **We prefer**: a category field on every rule and a RULES.md whose examples a test replays, over hand-maintained tables\n- **Because**: a replayed example cannot claim a fix the engine does not make\n- **Unless**: a rule fits no category, which calls for a new category rather than a catch-all\n\n### In practice\n\n- Sentence holds PG001 and PG002.\n- List holds PG003, PG006, PG007, PG008 and PG009.\n- Punctuation holds PG004 and PG005.\n- A before block must be followed by its after block, and a reported block must fire and survive a fix run.\n\n## Consequences\n\n### Pros\n\n- The documentation fails the build the moment a fixer changes its output.\n\n### Cons\n\n- Examples in RULES.md are limited to a text fence with a label in its info string.\n"},"PRS-0012":{"file":"0012-node-runs-a-published-bundle.md","status":"accepted","title":"Node runs a bundle built at publish time, and Bun runs the source","markdown":"<!-- GENERATED from PRS-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A public package is installed with whatever runtime the consumer has.\n> Many projects run npx and Node, and never Bun.\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the bundle inlines the mdast parser, so Node needs no dependency install)\n- Depended on by [PRS-0013](0013-releases-publish-from-github-actions.md) (the publish workflow ships this bundle)\n\n## Problem\n\n### Symptom\n\nThe bin pointed at TypeScript with a Bun shebang, and the CLI read files through Bun globals.\n\n### Pain point\n\nNode refuses to strip types from a file inside node_modules, so no Node consumer could run it.\n\n## Decision\n\n### The lens\n\n- **Given**: the package is consumed by both Bun and Node projects\n- **We prefer**: publishing to npm with a bundle built at pack time, over committing the bundle for git installs\n- **Because**: a committed bundle adds a regenerated file of about 300 kilobytes to every source change, and a registry install needs no allow-git opt-in\n- **Unless**: the package must be installed from git, where no build step runs and the bundle would have to be committed\n\n### In practice\n\n- src uses node APIs only, never a Bun global.\n- make build writes dist, and the test targets build it first so Node tests never run a stale bundle.\n- Bun is pinned through packageManager, so every machine builds the same bundle.\n- A git install no longer runs the CLI, and the README points consumers at the registry.\n\n## Consequences\n\n### Pros\n\n- npx, bunx and a dev dependency all run with one runtime installed.\n- Source changes carry no generated bundle in their diff.\n\n### Cons\n\n- Publishing needs an npm account and a manual release step.\n"},"PRS-0013":{"file":"0013-releases-publish-from-github-actions.md","status":"accepted","title":"Releases publish to npm from GitHub Actions through trusted publishing","markdown":"<!-- GENERATED from PRS-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A release that depends on one laptop and a long-lived token is slow to repeat and easy to leak.\n> The last package published this way took several attempts to get the pipeline right.\n\n## Relates to\n\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the workflow publishes the bundle that PRS-0012 builds at pack time)\n- Extended by [PRS-0014](0014-main-changes-only-through-pull-requests.md) (only main can start the workflow and only main can reach npm)\n\n## Problem\n\n### Symptom\n\nPublishing needed a maintainer to log in to npm and run every step by hand.\n\n### Pain point\n\nA stored npm token can leak, and a hand-run release has no link back to the commit it was built from.\n\n## Decision\n\n### The lens\n\n- **Given**: the package is public on npm under the jpeakai org\n- **We prefer**: a workflow_dispatch workflow using npm trusted publishing, over publishing from a laptop or with an NPM_TOKEN secret\n- **Because**: trusted publishing needs no stored secret, and provenance ties each version to the workflow run that built it\n- **Unless**: npm drops trusted publishing, where a granular automation token in a protected environment replaces it\n\n### In practice\n\n- The version comes from package.json, and the workflow owns the tag and the GitHub release.\n- The workflow refuses a version that is already tagged or already on npm.\n- CI and prepublishOnly run make check, since make ci needs the meta CLI from a private repo.\n- make ci stays the local gate before a release, so the decision bundle is still checked.\n- Only the first version is published by hand, because npm attaches a trusted publisher to an existing package.\n\n## Consequences\n\n### Pros\n\n- A release is a version bump, a push and one workflow run.\n- Each version carries provenance that npm shows on the package page.\n\n### Cons\n\n- GitHub Actions never renders the decision bundle, so a stale bundle is caught only locally.\n"},"PRS-0014":{"file":"0014-main-changes-only-through-pull-requests.md","status":"accepted","title":"Main changes only through pull requests, and releases run only from main","markdown":"<!-- GENERATED from PRS-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A published package turns every commit on main into something a consumer may install next.\n> A direct push or a release from a side branch skips the gate that makes that safe.\n\n## Relates to\n\n- Extends [PRS-0013](0013-releases-publish-from-github-actions.md) (the Publish workflow stays, and now only main can start it and only main can reach npm)\n\n## Problem\n\n### Symptom\n\nAny push could land on main, and a Publish run could start from any branch.\n\n### Pain point\n\nA run from a branch executes that branch's copy of the workflow, which could publish code main never had.\n\n## Decision\n\n### The lens\n\n- **Given**: main is the only source of releases, and the package is public on npm\n- **We prefer**: branch protection with required checks, plus a main-only environment, over trusting every push and dispatch\n- **Because**: npm trusted publishing checks the repo and workflow file but never the branch, so GitHub must refuse other branches\n- **Unless**: the repo gains outside maintainers, where a required review is added to the protection\n\n### In practice\n\n- Every change, including a version bump, lands on main through a pull request.\n- A pull request merges only when Check (Node 20) and Check (Node 24) pass on its latest commit.\n- Protection applies to admins, so no one pushes to main directly.\n- No approval is required while there is a single maintainer, who cannot approve their own pull request.\n- The Publish workflow fails loudly when started from any branch but main.\n- The npm trusted publisher names the npm environment.\n\n## Consequences\n\n### Pros\n\n- Every commit on main has passed CI before it can be released.\n- A branch cannot publish, even with an edited copy of the workflow.\n\n### Cons\n\n- A release takes two steps, a merged version bump and a workflow run.\n"},"PRS-0015":{"file":"0015-a-rule-reads-one-shared-context.md","status":"accepted","title":"A check and a fix both read one context built once per document","markdown":"<!-- GENERATED from PRS-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A check and its fix answer the same question at two moments.\n> They can only stay honest if they read the same data, not their own copy of it.\n\n## Relates to\n\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (the context is the argument the one-file-per-rule contract passes to both halves)\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the shared data is derived from the model parsed once)\n- Depended on by [PRS-0016](0016-a-shared-helper-sits-on-its-own-side.md) (where the code that reads the context lives)\n\n## Problem\n\n### Symptom\n\ncheck received a context carrying the interpunct runs, while fix received only the document model.\n\n### Pain point\n\nFour fixers called interpunctRuns themselves on every pass of a loop bounded at ten thousand passes. PG005 asked the same question two different ways in its two halves.\n\n## Decision\n\n### The lens\n\n- **Given**: several rules depend on data derived from the whole document rather than from one paragraph\n- **We prefer**: deriving that data once per document into a RuleContext both halves receive, over letting each half compute what it needs\n- **Because**: shared data is the only way the agreement between a check and its fix is structural rather than reviewed\n- **Unless**: the data is local to one rule, which keeps it inside that module\n\n### In practice\n\n- RuleContext holds the document model and the interpunct runs.\n- CheckContext extends it with the file name and the sentence budget.\n- FixContext is RuleContext, because a fixer names no file.\n- A new shared derivation is added to ruleContext, never recomputed in a rule.\n\n## Consequences\n\n### Pros\n\n- The fixpoint loop derives the runs once per pass rather than once per rule.\n- A rule module reads as data in, findings or edits out.\n\n### Cons\n\n- Shared data is computed for every document, including one no rule will read it for.\n"},"PRS-0016":{"file":"0016-a-shared-helper-sits-on-its-own-side.md","status":"superseded","title":"A helper shared by rules sits on the side of the rule it serves","markdown":"<!-- GENERATED from PRS-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A rule has two halves that answer to different things.\n> A reader should be able to tell which half a call belongs to without opening the file it came from.\n\n## Relates to\n\n- Superseded by [PRS-0017](0017-modules-group-by-what-a-function-takes.md) (the axis was tested against the import graph and did not hold)\n- Depends on [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context says what a rule is handed, and this says where the code that reads it lives)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a helper leaves its rule module only once a second rule needs it)\n\n## Problem\n\n### Symptom\n\nFive rules wrote out the same non-table paragraph filter, and four wrote out the same colon lookup.\n\n### Pain point\n\nA helper had no obvious home, so a rule kept its own copy and the copies drifted. PG005 and PG006 counted the same glyph two different ways.\n\n## Decision\n\n### The lens\n\n- **Given**: a helper turns out to be needed by a second rule\n- **We prefer**: moving it to the side whose data it reads, over a single grab-bag of shared code\n- **Because**: the arguments a helper takes already say which half of a rule it serves\n- **Unless**: only one rule needs it, which keeps it in that rule module\n\n### In practice\n\n- rules/utils.ts takes views, sentences and counts.\n- fix/ takes source offsets and returns ranges or edits.\n- A derivation with its own vocabulary gets a module, as interpunct.ts has.\n- The helper table in docs/DATA_MODEL.md names the module for every shared helper.\n\n## Consequences\n\n### Pros\n\n- A call site says which half of the rule it belongs to.\n- A count a check reports and a count a fixer compares cannot drift apart.\n\n### Cons\n\n- Two places to look for a helper rather than one.\n"},"PRS-0017":{"file":"0017-modules-group-by-what-a-function-takes.md","status":"accepted","title":"A module groups functions by what they take, not by who calls them","markdown":"<!-- GENERATED from PRS-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A folder name is a claim about what is inside it.\n> The claim has to survive someone reading the imports.\n\n## Relates to\n\n- Supersedes [PRS-0016](0016-a-shared-helper-sits-on-its-own-side.md) (the same question answered by the data a function takes rather than the half that calls it)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a helper leaves its rule module only once a second rule needs it)\n\n## Problem\n\n### Symptom\n\nrules/utils.ts imported from fix/spans.ts, so the side a helper was said to serve did not match the side it lived on.\n\n### Pain point\n\nfix/ held six helpers that no fixer used. first and last were imported by six rules and no fix module, and every list rule needed four import lines to say what it wanted.\n\n## Decision\n\n### The lens\n\n- **Given**: shared code has to live somewhere a reader can predict\n- **We prefer**: grouping by the data a function takes, over grouping by which half of a rule calls it\n- **Because**: the arguments are visible in the signature, while the callers are not\n- **Unless**: a derivation has its own vocabulary, which earns it a named module of its own\n\n### In practice\n\n- text.ts takes strings and ranges and imports nothing at all.\n- query.ts takes the model or a view and answers a read-only question.\n- interpunct.ts is the one named derivation, so it sits beside query.ts rather than among the rules.\n- fix/ holds only what builds or verifies an edit.\n- The layers import strictly downwards, so a cycle is a design error rather than a warning.\n\n## Consequences\n\n### Pros\n\n- src/rules/ holds the contract, the catalogue and the nine gates, and nothing else.\n- A rule imports three modules where it imported four, and each name says what it is.\n\n### Cons\n\n- The move rewrote every import in the package at once.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle
  // only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived
  // rather than assigned: fill is the group, size is in-degree (how many records
  // refine or supersede this one). Status rides on the border, because usually only
  // a couple of records are superseded and a whole colour channel would be wasted.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its group colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // A status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"], node[status = "retired"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: 'node[status = "proposed"]',
        style: { "border-width": 2, "border-color": css("muted"), "border-opacity": 1, "border-style": "dotted" },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
