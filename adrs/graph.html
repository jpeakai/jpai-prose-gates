n":"depended_on_by","note":"a plugin rule function may return a promise"}},{"data":{"id":"PRS-0020-depends_on-PRS-0019","source":"PRS-0020","target":"PRS-0019","label":"depends on","relation":"depends_on","note":"a plugin fixer is part of the plugin contract"}},{"data":{"id":"PRS-0020-depends_on-PRS-0005","source":"PRS-0020","target":"PRS-0005","label":"depends on","relation":"depends_on","note":"the fingerprint and the expected shape are the proof a plugin fixer meets"}},{"data":{"id":"PRS-0020-depended_on_by-PRS-0027","source":"PRS-0020","target":"PRS-0027","label":"depended on by","relation":"depended_on_by","note":"an async fixer meets the same verification"}},{"data":{"id":"PRS-0021-depends_on-PRS-0019","source":"PRS-0021","target":"PRS-0019","label":"depends on","relation":"depends_on","note":"categories are declared in the plugin's meta"}},{"data":{"id":"PRS-0021-extends-PRS-0011","source":"PRS-0021","target":"PRS-0011","label":"extends","relation":"extends","note":"PRS-0011 says a rule that fits no category calls for a new one, and this is how a plugin makes one"}},{"data":{"id":"PRS-0021-depended_on_by-PRS-0022","source":"PRS-0021","target":"PRS-0022","label":"depended on by","relation":"depended_on_by","note":"a local rule file declares its word by exporting categories"}},{"data":{"id":"PRS-0022-depends_on-PRS-0019","source":"PRS-0022","target":"PRS-0019","label":"depends on","relation":"depends_on","note":"discovery finds modules that have the plugin shape"}},{"data":{"id":"PRS-0022-depends_on-PRS-0021","source":"PRS-0022","target":"PRS-0021","label":"depends on","relation":"depends_on","note":"a local file declares its category by exporting it"}},{"data":{"id":"PRS-0022-depends_on-PRS-0018","source":"PRS-0022","target":"PRS-0018","label":"depends on","relation":"depends_on","note":"the config can list extra plugins or switch them all off"}},{"data":{"id":"PRS-0022-depends_on-PRS-0012","source":"PRS-0022","target":"PRS-0012","label":"depends on","relation":"depends_on","note":"the loader runs under the Node bundle and uses no Bun global"}},{"data":{"id":"PRS-0022-extended_by-PRS-0025","source":"PRS-0022","target":"PRS-0025","label":"extended by","relation":"extended_by","note":"a skip is now an explicit, reported choice rather than never allowed"}},{"data":{"id":"PRS-0022-depended_on_by-PRS-0026","source":"PRS-0022","target":"PRS-0026","label":"depended on by","relation":"depended_on_by","note":"a local file may be TypeScript where the runtime can import it"}},{"data":{"id":"PRS-0023-depends_on-PRS-0019","source":"PRS-0023","target":"PRS-0019","label":"depends on","relation":"depends_on","note":"a plugin rule reads the view through the model it is handed"}},{"data":{"id":"PRS-0023-depends_on-PRS-0001","source":"PRS-0023","target":"PRS-0001","label":"depends on","relation":"depends_on","note":"the view is derived from the tree parsed once"}},{"data":{"id":"PRS-0023-extended_by-PRS-0028","source":"PRS-0023","target":"PRS-0028","label":"extended by","relation":"extended_by","note":"a frontmatter edit is now allowed when the data is unchanged"}},{"data":{"id":"PRS-0024-depends_on-PRS-0018","source":"PRS-0024","target":"PRS-0018","label":"depends on","relation":"depends_on","note":"the config failures it names are the ones the config file can raise"}},{"data":{"id":"PRS-0024-depended_on_by-PRS-0025","source":"PRS-0024","target":"PRS-0025","label":"depended on by","relation":"depended_on_by","note":"lenient loading branches on the plugin error classes"}},{"data":{"id":"PRS-0025-extends-PRS-0022","source":"PRS-0025","target":"PRS-0022","label":"extends","relation":"extends","note":"PRS-0022 said there is no skipped plugin, and this makes a skip an explicit choice that is still reported"}},{"data":{"id":"PRS-0025-depends_on-PRS-0024","source":"PRS-0025","target":"PRS-0024","label":"depends on","relation":"depends_on","note":"lenient loading and validation branch on the plugin error classes"}},{"data":{"id":"PRS-0026-depends <script id="record-data" type="application/json">{"PRS-0001":{"file":"0001-parse-once-to-mdast.md","status":"accepted","title":"Every rule reads one mdast tree parsed once per file","markdown":"<!-- GENERATED from PRS-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Markdown is a grammar, not a line format.\n> A rule that guesses structure from lines disagrees with every renderer sooner or later.\n\n## Relates to\n\n- Depended on by [PRS-0012](0012-node-runs-a-published-bundle.md) (the Node bundle inlines the same parser)\n- Depended on by [PRS-0003](0003-splice-source-never-restringify.md) (splicing addresses source through the tree offsets)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the shared rule context derives from the model parsed once)\n- Depended on by [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (the frontmatter view is derived from the tree parsed once)\n\n## Problem\n\n### Symptom\n\nEach rule decided for itself what counted as code, a table or a list. The answers drifted between rules.\n\n### Pain point\n\nA finding inside inline code, a link url or a table cell was a false positive that no single fix could remove.\n\n## Decision\n\n### The lens\n\n- **Given**: several rules need to know which bytes are prose and which are structure\n- **We prefer**: parsing each file once with micromark into mdast and handing every rule the same model, over per-rule line scanning\n- **Because**: the parser already implements CommonMark and GFM exactly, so exemptions come from node types rather than heuristics\n- **Unless**: a rule needs something the tree loses, such as the original spacing, in which case it reads the source through node offsets\n\n### In practice\n\n- A rule reads text nodes, paragraph views and offsets from DocModel.\n- Code, inline code, html and link urls are exempt because they are never text nodes.\n- Source positions come from the tree, so a finding points at the real line.\n\n## Consequences\n\n### Pros\n\n- Exemptions are consistent across every rule.\n- A new rule starts from structure rather than rebuilding it.\n\n### Cons\n\n- The package depends on the unified parser family.\n- A rule must map tree positions back to source offsets to edit anything.\n"},"PRS-0002":{"file":"0002-generated-markdown-is-gated.md","status":"accepted","title":"Generated markdown is gated like hand-written markdown","markdown":"<!-- GENERATED from PRS-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A reader cannot tell which page was generated.\n> Slop in rendered output reads exactly like slop written by hand.\n\n## Problem\n\n### Symptom\n\nGenerated files were excluded from the gates because nobody may edit them.\n\n### Pain point\n\nThe slop moved into records and templates, where the gates never looked.\n\n## Decision\n\n### The lens\n\n- **Given**: a markdown file is produced by rendering a record or a template\n- **We prefer**: gating the rendered output and tracing each finding back to its source, over exempting generated paths\n- **Because**: the reader sees the rendered page, so that page is what must meet the standard\n- **Unless**: the generator's own boilerplate trips a rule, in which case the template is fixed rather than the rule relaxed\n\n### In practice\n\n- Consumers pass adrs/*.md to the gates with every other markdown file.\n- A finding in generated output is fixed in the record or the template.\n- The fixer is never run over generated files, since the next render would undo it.\n\n## Consequences\n\n### Pros\n\n- The standard holds on every page a reader can open.\n- Template defects surface once and are fixed once.\n\n### Cons\n\n- A finding points at a file the contributor must not edit.\n"},"PRS-0003":{"file":"0003-splice-source-never-restringify.md","status":"accepted","title":"Fixes splice source slices and never re-stringify the tree","markdown":"<!-- GENERATED from PRS-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A formatter owns every byte it prints.\n> A gate that fixes one rule has no business changing the author's emphasis markers, escapes or table padding.\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (slices are addressed through the offsets the parsed tree supplies)\n- Depended on by [PRS-0005](0005-every-fix-is-verified.md) (one spliced range is cheap to verify)\n\n## Problem\n\n### Symptom\n\nSerialising the tree normalises the whole file, so a one-word fix produced a diff across every line.\n\n### Pain point\n\nA contributor could not review the fix, and the rewrite fought every other formatter in the repo.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule wants to change a small part of a document\n- **We prefer**: splicing a replacement built from source slices into the original text, over editing the tree and stringifying it\n- **Because**: every byte outside the edit is preserved by construction, so the diff is exactly the fix\n- **Unless**: no source slice can express the change, in which case the rule refuses rather than generating markup\n\n### In practice\n\n- An edit carries a start offset, an end offset and replacement text.\n- Links, emphasis, escapes and code spans travel inside slices unchanged.\n- The only generated markup is list markers, a lead-in colon and line breaks.\n\n## Consequences\n\n### Pros\n\n- Fix diffs are minimal and reviewable.\n- The fixer coexists with any other markdown formatter.\n\n### Cons\n\n- Each fixer must reason about offsets, escapes and line endings itself.\n- Overlapping edits cannot be combined and must wait for the next pass.\n"},"PRS-0004":{"file":"0004-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the input is ambiguous","markdown":"<!-- GENERATED from PRS-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A wrong autofix is worse than no autofix.\n> The finding still asks a human, while a silent rewrite changes meaning nobody reviewed.\n\n## Relates to\n\n- Extended by [PRS-0005](0005-every-fix-is-verified.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0007](0007-em-dash-becomes-parentheses-or-colon.md) (the em-dash fixer refuses every shape outside two)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (the refuses helper asserts untouched output)\n\n## Problem\n\n### Symptom\n\nHeuristics that looked right on typical prose rewrote paired cross-references into a numbered list.\n\n### Pain point\n\nThe fix passed every gate, so the changed meaning shipped without anyone reading it.\n\n## Decision\n\n### The lens\n\n- **Given**: a fixer cannot be sure its rewrite keeps the author's meaning\n- **We prefer**: refusing and leaving the finding reported, over applying the most likely rewrite\n- **Because**: the check still fails, so a human sees the case, while a wrong fix hides it permanently\n- **Unless**: never\n\n### In practice\n\n- Escapes, hard breaks, tables, blockquotes and mixed marker families make a fixer refuse.\n- A refusal is a normal outcome, reported as a remaining finding.\n- Every new refusal condition comes with an adversarial test.\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff line by line.\n\n### Cons\n\n- Some fixable prose stays reported until a human edits it.\n"},"PRS-0005":{"file":"0005-every-fix-is-verified.md","status":"accepted","title":"Every fix is verified against a content fingerprint and an expected shape","markdown":"<!-- GENERATED from PRS-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A fixer is a heuristic, and heuristics have bugs.\n> The engine checks the result instead of trusting the rule that produced it.\n\n## Relates to\n\n- Depends on [PRS-0003](0003-splice-source-never-restringify.md) (verification is cheap because an edit is a single spliced range)\n- Extends [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0006](0006-sentence-length-is-never-autofixed.md) (a length fix would change the fingerprint)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (properties assert the fingerprint is preserved)\n- Depended on by [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (a plugin fixer meets the same fingerprint and shape proof)\n- Depended on by [PRS-0028](0028-frontmatter-edits-are-verified-by-data-equality.md) (a new expectation compares YAML data before and after)\n\n## Problem\n\n### Symptom\n\nA fixer bug could drop a word, create emphasis from a stray asterisk, or split one paragraph into two.\n\n### Pain point\n\nThe damage looked like formatting, so nothing downstream noticed it.\n\n## Decision\n\n### The lens\n\n- **Given**: an edit is about to be written back to a file\n- **We prefer**: reparsing the result and comparing its words, urls and code to the original, over trusting the fixer's own logic\n- **Because**: a changed fingerprint is a tool bug that must fail loudly, while a shape mismatch is an unforeseen case\n- **Unless**: never\n\n### In practice\n\n- The fingerprint is every word, url, alt text and code value in order, ignoring enumeration markers and joining conjunctions.\n- A changed fingerprint throws FixInvariantError, which fails the run.\n- Each edit declares same-tree, same-shape or replace-paragraph, and a mismatch refuses that edit.\n- Fixes run to a fixpoint in a fixed rule order, one verified pass at a time.\n\n## Consequences\n\n### Pros\n\n- A fixer bug surfaces as a crash instead of a silent content change.\n\n### Cons\n\n- Every edit costs a reparse of the document.\n- The fingerprint must know which tokens a fix may legitimately remove.\n"},"PRS-0006":{"file":"0006-sentence-length-is-never-autofixed.md","status":"accepted","title":"Sentence length is reported and never autofixed","markdown":"<!-- GENERATED from PRS-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Every other rule changes punctuation or layout.\n> Shortening a sentence means choosing what to cut, and that choice belongs to the author.\n\n## Relates to\n\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint forbids the word changes a length fix would need)\n- Extended by [PRS-0010](0010-length-findings-guide-a-split.md) (the message estimates clauses to guide a split)\n\n## Problem\n\n### Symptom\n\nSplitting a long sentence mechanically at a comma produces fragments, and cutting clauses drops content.\n\n### Pain point\n\nEither rewrite changes what the author said, which no gate is entitled to do.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence exceeds the word budget\n- **We prefer**: reporting the finding for a human to rewrite, over any mechanical split or trim\n- **Because**: every shortening changes words, and the fingerprint rightly rejects any fix that changes words\n- **Unless**: never\n\n### In practice\n\n- PG002 findings survive a fix run unchanged.\n- The budget is tuned with the max-words flag rather than by relaxing the rule.\n\n## Consequences\n\n### Pros\n\n- The fixer never rewrites meaning.\n\n### Cons\n\n- A fix run can finish with findings left, so CI still fails until a human edits.\n"},"PRS-0007":{"file":"0007-em-dash-becomes-parentheses-or-colon.md","status":"accepted","title":"An em-dash pair becomes parentheses and a lone em-dash becomes a colon","markdown":"<!-- GENERATED from PRS-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Two dashes in one sentence almost always bracket an aside.\n> One dash almost always introduces what follows.\n\n## Relates to\n\n- Depends on [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (every pattern outside the two shapes is refused)\n\n## Problem\n\n### Symptom\n\nEm-dashes are the most common slop glyph, and reporting each one made fix runs noisy.\n\n### Pain point\n\nThe right replacement depends on how many dashes a sentence holds, which a human decides the same way every time.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence in prose contains an em-dash\n- **We prefer**: replacing a pair with parentheses and a single dash with a colon, over reporting every dash for a manual rewrite\n- **Because**: those two shapes have one reading each, so the replacement keeps the meaning\n- **Unless**: the dash touches punctuation, sits between digits, shares a sentence with a colon, or brackets a marker\n\n### In practice\n\n- `Bun \u2014 the runtime \u2014 is fast` becomes `Bun (the runtime) is fast`.\n- `One rule \u2014 no dashes` becomes `One rule: no dashes`.\n- Three or more dashes in one sentence are refused.\n- HTML entities are reported but never decoded.\n\n## Consequences\n\n### Pros\n\n- The most common glyph finding clears without a human.\n\n### Cons\n\n- The rule carries a growing list of refusal conditions.\n"},"PRS-0008":{"file":"0008-one-file-per-rule.md","status":"accepted","title":"Each rule lives in its own file with its check and its fix together","markdown":"<!-- GENERATED from PRS-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A rule's check and fix must agree on what counts as a finding.\n> Keeping them side by side makes a disagreement visible in one diff.\n\n## Relates to\n\n- Extended by [PRS-0011](0011-rules-carry-a-category.md) (rules also carry a category, as a field rather than a folder)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context is what a rule module receives in both halves)\n- Depended on by [PRS-0016](0016-modules-group-by-what-a-function-takes.md) (a helper leaves its rule module for the layer whose data it takes)\n- Extended by [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (the id a rule file is named by is now category-short-name)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule is the same unit, a check with an optional fix)\n\n## Problem\n\n### Symptom\n\nAll nine rules and the CLI shared one file, so any change touched everything.\n\n### Pain point\n\nAdding fixers would have doubled the file, and shared helpers were impossible to test alone.\n\n## Decision\n\n### The lens\n\n- **Given**: the package holds several independent rules that each gain a fixer\n- **We prefer**: one module per rule named by id and slug, with shared machinery in src/fix, over grouping rules by theme in larger files\n- **Because**: the rule id is how findings, tests and fixtures are named, so the file tree mirrors it\n- **Unless**: two rules share a detector, in which case the detector moves to its own module, as interpunct.ts does\n\n### In practice\n\n- A rule file is named pgNNN-slug.ts.\n- A fixture directory is named after the rule id it exercises.\n- src/bin.ts holds the process glue, so tests import cli.ts without exiting.\n\n## Consequences\n\n### Pros\n\n- A rule and its tests can be read without the rest of the package.\n\n### Cons\n\n- Fix ordering lives in the engine, away from the rules it orders.\n"},"PRS-0009":{"file":"0009-adversarial-and-property-tests-gate-fixes.md","status":"accepted","title":"Adversarial and property tests gate every change to fix behaviour","markdown":"<!-- GENERATED from PRS-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Example tests show a fixer works on the cases its author imagined.\n> The bugs live in the cases nobody imagined.\n\n## Relates to\n\n- Tests [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the refuses helper asserts untouched output)\n- Tests [PRS-0005](0005-every-fix-is-verified.md) (properties assert the fingerprint is preserved)\n\n## Problem\n\n### Symptom\n\nEach fixer passed its happy-path fixtures while rewriting escapes, CRLF files and cross-references wrongly.\n\n### Pain point\n\nThose failures change meaning in real documents, so they cannot wait for a user report.\n\n## Decision\n\n### The lens\n\n- **Given**: a change touches how any rule fixes prose\n- **We prefer**: exact fixtures, adversarial suites and generated property tests together, over example tests alone\n- **Because**: each layer catches a class of bug the others miss, and a regression becomes a named test\n- **Unless**: never\n\n### In practice\n\n- A found bug gets an adversarial test before its fix.\n- Properties assert no throw, idempotence, a kept fingerprint, no new findings and byte-identical fences.\n- Tests use the real parser and real files, never mocks.\n\n## Consequences\n\n### Pros\n\n- A fixer bug usually fails a property before it reaches a document.\n\n### Cons\n\n- The suite is slower than example tests alone.\n- A property counterexample can take time to shrink into a readable test.\n"},"PRS-0010":{"file":"0010-length-findings-guide-a-split.md","status":"accepted","title":"A sentence length finding estimates clauses to guide a split","markdown":"<!-- GENERATED from PRS-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A finding is also an instruction.\n> An agent told only that a sentence is too long cuts words until it fits, and the result reads like a telegram.\n\n## Relates to\n\n- Extends [PRS-0006](0006-sentence-length-is-never-autofixed.md) (the rule stays report-only, and its message now carries the guidance a human or agent needs)\n\n## Problem\n\n### Symptom\n\nA PG002 message gave only a word count and a budget.\n\n### Pain point\n\nThe cheapest way to meet a word budget is to delete words, so rewrites lost articles, connectives and meaning.\n\n## Decision\n\n### The lens\n\n- **Given**: a sentence exceeds the word budget and a human or an agent must rewrite it\n- **We prefer**: reporting potential clauses and a target sentence count, over reporting the word count alone\n- **Because**: a count of clauses names where the sentence can split, which makes splitting easier than compressing\n- **Unless**: a real parser becomes deterministic enough to replace the heuristic, which would supersede the counting method only\n\n### In practice\n\n- A clause boundary is a semicolon or colon with text after it, a comma before a coordinating conjunction, or a subordinating word.\n- The target is the largest of two, the clause count and the word count divided by the budget.\n- The count is labelled potential, because an Oxford comma in a list also reads as a boundary.\n\n## Consequences\n\n### Pros\n\n- Rewrites keep their connective words and read as prose.\n- The message stays deterministic, with no model or dependency.\n\n### Cons\n\n- The heuristic overcounts lists and undercounts clauses joined without a marker word.\n"},"PRS-0011":{"file":"0011-rules-carry-a-category.md","status":"accepted","title":"Each rule carries a category, and RULES.md is held true by a test","markdown":"<!-- GENERATED from PRS-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Nine rule ids say nothing about which rules share a purpose.\n> Five of them promote a hidden list, and a reader should see that at a glance.\n\n## Relates to\n\n- Extends [PRS-0008](0008-one-file-per-rule.md) (a category is a field on the rule module, never a folder, so files stay named by rule id)\n- Extended by [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (the category is now the first word of a rule id)\n- Extended by [PRS-0021](0021-plugins-declare-their-categories.md) (a plugin adds a category by declaring it)\n\n## Problem\n\n### Symptom\n\nThe README listed nine rules in id order with a one-line fix each.\n\n### Pain point\n\nA one-line summary cannot show what a fix writes, and a hand-written example drifts from the code.\n\n## Decision\n\n### The lens\n\n- **Given**: rules need grouping and each fix needs a concrete example\n- **We prefer**: a category field on every rule and a RULES.md whose examples a test replays, over hand-maintained tables\n- **Because**: a replayed example cannot claim a fix the engine does not make\n- **Unless**: a rule fits no category, which calls for a new category rather than a catch-all\n\n### In practice\n\n- Sentence holds PG001 and PG002.\n- List holds PG003, PG006, PG007, PG008 and PG009.\n- Punctuation holds PG004 and PG005.\n- A before block must be followed by its after block, and a reported block must fire and survive a fix run.\n\n## Consequences\n\n### Pros\n\n- The documentation fails the build the moment a fixer changes its output.\n\n### Cons\n\n- Examples in RULES.md are limited to a text fence with a label in its info string.\n"},"PRS-0012":{"file":"0012-node-runs-a-published-bundle.md","status":"accepted","title":"Node runs a bundle built at publish time, and Bun runs the source","markdown":"<!-- GENERATED from PRS-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A public package is installed with whatever runtime the consumer has.\n> Many projects run npx and Node, and never Bun.\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the bundle inlines the mdast parser, so Node needs no dependency install)\n- Depended on by [PRS-0013](0013-releases-publish-from-github-actions.md) (the publish workflow ships this bundle)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (the plugin loader runs under the Node bundle)\n- Depended on by [PRS-0026](0026-typescript-local-rules-need-a-runtime-that-imports-them.md) (the Node bundle imports a TypeScript rule with the runtime it is given)\n\n## Problem\n\n### Symptom\n\nThe bin pointed at TypeScript with a Bun shebang, and the CLI read files through Bun globals.\n\n### Pain point\n\nNode refuses to strip types from a file inside node_modules, so no Node consumer could run it.\n\n## Decision\n\n### The lens\n\n- **Given**: the package is consumed by both Bun and Node projects\n- **We prefer**: publishing to npm with a bundle built at pack time, over committing the bundle for git installs\n- **Because**: a committed bundle adds a regenerated file of about 300 kilobytes to every source change, and a registry install needs no allow-git opt-in\n- **Unless**: the package must be installed from git, where no build step runs and the bundle would have to be committed\n\n### In practice\n\n- src uses node APIs only, never a Bun global.\n- make build writes dist, and the test targets build it first so Node tests never run a stale bundle.\n- Bun is pinned through packageManager, so every machine builds the same bundle.\n- A git install no longer runs the CLI, and the README points consumers at the registry.\n\n## Consequences\n\n### Pros\n\n- npx, bunx and a dev dependency all run with one runtime installed.\n- Source changes carry no generated bundle in their diff.\n\n### Cons\n\n- Publishing needs an npm account and a manual release step.\n"},"PRS-0013":{"file":"0013-releases-publish-from-github-actions.md","status":"accepted","title":"Releases publish to npm from GitHub Actions through trusted publishing","markdown":"<!-- GENERATED from PRS-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A release that depends on one laptop and a long-lived token is slow to repeat and easy to leak.\n> The last package published this way took several attempts to get the pipeline right.\n\n## Relates to\n\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the workflow publishes the bundle that PRS-0012 builds at pack time)\n- Extended by [PRS-0014](0014-main-changes-only-through-pull-requests.md) (only main can start the workflow and only main can reach npm)\n\n## Problem\n\n### Symptom\n\nPublishing needed a maintainer to log in to npm and run every step by hand.\n\n### Pain point\n\nA stored npm token can leak, and a hand-run release has no link back to the commit it was built from.\n\n## Decision\n\n### The lens\n\n- **Given**: the package is public on npm under the jpeakai org\n- **We prefer**: a workflow_dispatch workflow using npm trusted publishing, over publishing from a laptop or with an NPM_TOKEN secret\n- **Because**: trusted publishing needs no stored secret, and provenance ties each version to the workflow run that built it\n- **Unless**: npm drops trusted publishing, where a granular automation token in a protected environment replaces it\n\n### In practice\n\n- The version comes from package.json, and the workflow owns the tag and the GitHub release.\n- The workflow refuses a version that is already tagged or already on npm.\n- CI and prepublishOnly run make check, since make ci needs the meta CLI from a private repo.\n- make ci stays the local gate before a release, so the decision bundle is still checked.\n- Only the first version is published by hand, because npm attaches a trusted publisher to an existing package.\n\n## Consequences\n\n### Pros\n\n- A release is a version bump, a push and one workflow run.\n- Each version carries provenance that npm shows on the package page.\n\n### Cons\n\n- GitHub Actions never renders the decision bundle, so a stale bundle is caught only locally.\n"},"PRS-0014":{"file":"0014-main-changes-only-through-pull-requests.md","status":"accepted","title":"Main changes only through pull requests, and releases run only from main","markdown":"<!-- GENERATED from PRS-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A published package turns every commit on main into something a consumer may install next.\n> A direct push or a release from a side branch skips the gate that makes that safe.\n\n## Relates to\n\n- Extends [PRS-0013](0013-releases-publish-from-github-actions.md) (the Publish workflow stays, and now only main can start it and only main can reach npm)\n\n## Problem\n\n### Symptom\n\nAny push could land on main, and a Publish run could start from any branch.\n\n### Pain point\n\nA run from a branch executes that branch's copy of the workflow, which could publish code main never had.\n\n## Decision\n\n### The lens\n\n- **Given**: main is the only source of releases, and the package is public on npm\n- **We prefer**: branch protection with required checks, plus a main-only environment, over trusting every push and dispatch\n- **Because**: npm trusted publishing checks the repo and workflow file but never the branch, so GitHub must refuse other branches\n- **Unless**: the repo gains outside maintainers, where a required review is added to the protection\n\n### In practice\n\n- Every change, including a version bump, lands on main through a pull request.\n- A pull request merges only when Check (Node 20) and Check (Node 24) pass on its latest commit.\n- Protection applies to admins, so no one pushes to main directly.\n- No approval is required while there is a single maintainer, who cannot approve their own pull request.\n- The Publish workflow fails loudly when started from any branch but main.\n- The npm trusted publisher names the npm environment.\n\n## Consequences\n\n### Pros\n\n- Every commit on main has passed CI before it can be released.\n- A branch cannot publish, even with an edited copy of the workflow.\n\n### Cons\n\n- A release takes two steps, a merged version bump and a workflow run.\n"},"PRS-0015":{"file":"0015-a-rule-reads-one-shared-context.md","status":"accepted","title":"A check and a fix both read one context built once per document","markdown":"<!-- GENERATED from PRS-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A check and its fix answer the same question at two moments.\n> They can only stay honest if they read the same data, not their own copy of it.\n\n## Relates to\n\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (the context is the argument the one-file-per-rule contract passes to both halves)\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the shared data is derived from the model parsed once)\n- Depended on by [PRS-0016](0016-modules-group-by-what-a-function-takes.md) (where the code that reads the context lives)\n- Depended on by [PRS-0018](0018-config-file-and-rule-control.md) (the registry decides which runs count as reported inside the context)\n\n## Problem\n\n### Symptom\n\ncheck received a context carrying the interpunct runs, while fix received only the document model.\n\n### Pain point\n\nFour fixers called interpunctRuns themselves on every pass of a loop bounded at ten thousand passes. PG005 asked the same question two different ways in its two halves.\n\n## Decision\n\n### The lens\n\n- **Given**: several rules depend on data derived from the whole document rather than from one paragraph\n- **We prefer**: deriving that data once per document into a RuleContext both halves receive, over letting each half compute what it needs\n- **Because**: shared data is the only way the agreement between a check and its fix is structural rather than reviewed\n- **Unless**: the data is local to one rule, which keeps it inside that module\n\n### In practice\n\n- RuleContext holds the document model and the interpunct runs.\n- CheckContext extends it with the file name and the sentence budget.\n- FixContext is RuleContext, because a fixer names no file.\n- A new shared derivation is added to ruleContext, never recomputed in a rule.\n\n## Consequences\n\n### Pros\n\n- The fixpoint loop derives the runs once per pass rather than once per rule.\n- A rule module reads as data in, findings or edits out.\n\n### Cons\n\n- Shared data is computed for every document, including one no rule will read it for.\n"},"PRS-0016":{"file":"0016-modules-group-by-what-a-function-takes.md","status":"accepted","title":"A module groups functions by what they take, not by who calls them","markdown":"<!-- GENERATED from PRS-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A folder name is a claim about what is inside it.\n> The claim has to survive someone reading the imports.\n\n## Relates to\n\n- Depends on [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context says what a rule is handed, and this says where the code that reads it lives)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a helper leaves its rule module only once a second rule needs it)\n\n## Problem\n\n### Symptom\n\nfix/spans.ts held matchesIn, sentenceSpans, within, collapse and escaped, which every check reads, so the folder name did not describe what was in it.\n\n### Pain point\n\nmodel.ts also owned words, sentences and inRanges, which need no markdown at all. A helper had no predictable home, so a rule kept a private copy. Four rules wrote out the same colon lookup and five the same table filter.\n\n## Decision\n\n### The lens\n\n- **Given**: shared code has to live somewhere a reader can predict\n- **We prefer**: grouping by the data a function takes, over grouping by which half of a rule calls it\n- **Because**: the arguments are visible in the signature, while the callers are not\n- **Unless**: a derivation has its own vocabulary, which earns it a named module of its own\n\n### In practice\n\n- text.ts takes strings and ranges and imports nothing at all.\n- query.ts takes the model or a view and answers a read-only question.\n- interpunct.ts is the one named derivation, so it sits beside query.ts rather than among the rules.\n- fix/ holds only what builds or verifies an edit.\n- The layers import strictly downwards, so a cycle is a design error rather than a warning.\n\n## Consequences\n\n### Pros\n\n- src/rules/ holds the contract, the catalogue and the nine gates, and nothing else.\n- A module name is checkable, because a reader confirms it from the signatures inside rather than by finding the callers.\n\n### Cons\n\n- The move rewrote every import in the package at once.\n- Sharing a helper costs an import edge where duplication cost none, so a rule now names more modules than it did.\n"},"PRS-0017":{"file":"0017-rule-ids-are-category-and-short-name.md","status":"accepted","title":"A rule id is its category followed by a short name","markdown":"<!-- GENERATED from PRS-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A number says nothing about what a rule does or what it guards.\n> The id appears in every finding, so it has to be readable where it is read.\n\n## Relates to\n\n- Extends [PRS-0008](0008-one-file-per-rule.md) (a rule file is still named by its id, and the id is now category-short-name instead of pgNNN-slug)\n- Extends [PRS-0011](0011-rules-carry-a-category.md) (the category a rule carries is the first word of its id)\n- Depended on by [PRS-0018](0018-config-file-and-rule-control.md) (a config names a rule by its id)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin id is the namespace in front of category-short-name)\n\n## Problem\n\n### Symptom\n\nA finding read \"PG006\" and the reader had to open RULES.md to learn it meant an interpunct-joined list.\n\n### Pain point\n\nNumbers also imply an order and a count, so adding or retiring a rule left gaps or renumbered history.\n\n## Decision\n\n### The lens\n\n- **Given**: every finding, fixture, heading and test names a rule by its id\n- **We prefer**: an id of one lower-case category word and a three or four word short name, joined by hyphens, over a sequential number\n- **Because**: the id then says what the rule guards before anyone looks it up\n- **Unless**: a new rule fits no existing category, which calls for a new category rather than a catch-all word\n\n### In practice\n\n- The category is the first word and is one of the values in CATEGORIES.\n- The short name is three or four words that describe the finding, not the fix.\n- A rule file, its fixture directories and its RULES.md heading all use the id unchanged.\n- An exported constant uses the camel-case form of the id.\n- A retired id is never reused for a different rule.\n- The old PG numbers are gone with no alias, so a config that names one fails loudly.\n\n## Consequences\n\n### Pros\n\n- A finding line explains itself.\n- Files sort by category in a directory listing.\n\n### Cons\n\n- Ids are longer in help output and tables.\n- Accepted records written before this one still say PG001 to PG009.\n"},"PRS-0018":{"file":"0018-config-file-and-rule-control.md","status":"accepted","title":"An optional config file switches rules off and sets their options","markdown":"<!-- GENERATED from PRS-0018 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A team needs to turn a rule off or tune it without forking the package.\n> A setting that names nothing must fail, or a retired id looks like it worked.\n\n## Relates to\n\n- Depends on [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the registry decides which interpunct runs count as reported, inside the shared context)\n- Depends on [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (a config names a rule by its category-short-name id, and a retired PG id is an unknown id)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (plugin rules are switched off and given options through the same file)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (the config can list extra plugins or turn all of them off)\n- Depended on by [PRS-0024](0024-failures-are-named-errors-with-codes.md) (the config failures it raises are named errors with codes)\n\n## Problem\n\n### Symptom\n\nThe CLI took four flags and had no place to say that one rule does not suit a project.\n\n### Pain point\n\nSwitching a rule off meant forking, and a rule that others defer to could hide findings if it were switched off naively.\n\n## Decision\n\n### The lens\n\n- **Given**: a project wants to disable a rule, tune its budget, or run extra rules\n- **We prefer**: an optional config at the project root, validated against the loaded rules, over flags alone or a silent skip of unknown names\n- **Because**: a config that is checked at load cannot drift from the rules it names\n- **Unless**: a setting needs more than a severity and a typed option, which calls for a new record\n\n### In practice\n\n- The file is prose-gates.config.json or .mjs at the project root, or the path in --config, and two at one root is an error.\n- A rule is \"error\", \"off\", or [severity, options]. There is no warning tier, because the tool exits 1 on any finding.\n- A rule that is off loses its check and its fixer together, so --fix cannot apply it.\n- An id that matches no loaded rule is a usage error with exit code 2. This catches a stale PG id.\n- An option must be one the rule declares, with the declared type. maxWords must be at least 1.\n- The sentence budget is the --max-words flag, then the rule's maxWords option, then 25.\n- An interpunct run counts as reported only while its owning rule is on. The glyph rule reports a run whose owner is off.\n\n## Consequences\n\n### Pros\n\n- A typo in a rule id fails the run instead of doing nothing.\n- Switching a list rule off never leaves a run that no rule reports.\n\n### Cons\n\n- The project root is a heuristic, the nearest ancestor with a package.json, a config or a .prose-gates directory.\n- A second config format needs a new record, because .json and .mjs are the only two read.\n"},"PRS-0019":{"file":"0019-plugin-contract-and-namespace.md","status":"accepted","title":"A plugin rule is a built-in rule with a namespace, and the plugin names it","markdown":"<!-- GENERATED from PRS-0019 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A third-party rule must not need a second code path in the engine.\n> The only new thing a plugin brings is a name that cannot clash with a built-in.\n\n## Relates to\n\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (plugin rules join the registry and answer to the same config)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a plugin rule is the same unit, a check with an optional fix)\n- Depends on [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (a rule key is category-short-name and the id adds the namespace in front)\n- Depended on by [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (fixers from a plugin are held to the same proof)\n- Depended on by [PRS-0021](0021-plugins-declare-their-categories.md) (a plugin declares its categories in its meta)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (discovery finds modules that have this shape)\n- Depended on by [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (the frontmatter view is part of the model a plugin rule reads)\n- Depended on by [PRS-0027](0027-rules-may-be-async.md) (a plugin rule function may return a promise)\n\n## Problem\n\n### Symptom\n\nThe rule set, the id type and the fix order were closed arrays and a union of nine literals.\n\n### Pain point\n\nA house style could only be added by changing this repository.\n\n## Decision\n\n### The lens\n\n- **Given**: a user wants a rule this package does not ship\n- **We prefer**: a plugin whose default export is { meta, rules }, with rules receiving the built-in context, over a second rule interface\n- **Because**: one contract means the engine, the fixer proof and the config treat every rule alike\n- **Unless**: the contract must change in a way a plugin would notice, which bumps apiVersion\n\n### In practice\n\n- meta has name, namespace, apiVersion and optional categories. apiVersion is 1, and any other value fails the load with both numbers.\n- The namespace comes from meta.namespace only, never from the package name, and must be lower-case words joined by hyphens.\n- The namespace local is reserved for local files, and two plugins that claim one namespace fail the load, naming both.\n- A rule key is category-short-name, so the key must start with its category and a plugin id reads namespace/category-short-name.\n- A rule has a category, a summary, a check, an optional fix and optional typed options.\n- The context adds options and helpers, the plain functions words, sentences and lengthMessage, so a plugin never has to import this package.\n- A check cannot take the run down. A throw or a malformed finding becomes a finding for that rule and the others carry on.\n- A finding carries its own rule id and file whatever the plugin returned, so a plugin cannot report as another rule.\n\n## Consequences\n\n### Pros\n\n- A plugin rule is switched off, given options and listed exactly like a built-in.\n- A plugin cannot clash with a built-in id, because a core id has no slash.\n\n### Cons\n\n- A throwing built-in still crashes the run, while a throwing plugin rule does not, so the two are not treated alike.\n- apiVersion is one integer, so any breaking change fails every plugin until it is updated.\n"},"PRS-0020":{"file":"0020-plugin-fixers-stay-under-verification.md","status":"accepted","title":"A plugin fixer is held to the same proof as a built-in one","markdown":"<!-- GENERATED from PRS-0020 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: The engine never trusted a fixer, so a plugin fixer needs no special trust.\n> Allowing fixers is safe only because verification does not care who wrote them.\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin fixer is part of the plugin contract)\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint and the expected shape are the proof a plugin fixer meets)\n- Depended on by [PRS-0027](0027-rules-may-be-async.md) (an async fixer meets the same verification)\n\n## Problem\n\n### Symptom\n\nA user who writes a fixer could lose a word or corrupt a document.\n\n### Pain point\n\nCheck-only plugins would be safe but would leave every plugin rule to a human to fix by hand.\n\n## Decision\n\n### The lens\n\n- **Given**: a plugin proposes edits to a document\n- **We prefer**: allowing the fixer and applying the verification every built-in meets, over banning plugin fixers\n- **Because**: a word lost or added throws, a structure that is not as declared is refused, and neither depends on who wrote the fixer\n- **Unless**: no expectation kind fits the edit, as with an edit inside frontmatter, in which case it is refused\n\n### In practice\n\n- Plugin fixers run after the built-ins, in load order, inside the same fixpoint loop. The loop restarts from the top after any accepted edit.\n- An edit is refused before it is spliced if its offsets are not whole, in order and inside the source. The same holds if its text is not a string.\n- An edit with no valid expectation, a fixer that throws, or a fixer that returns a non-list stops the run and names the rule.\n- A fixer cannot claim another rule's id. The engine stamps its own.\n- A fixer that never settles throws after the pass limit.\n- Plugins are trusted code with no sandbox. A fixer that never returns cannot be stopped.\n\n## Consequences\n\n### Pros\n\n- A plugin fixer can never change what a document says.\n- Hostile fixers are covered by adversarial tests rather than by review.\n\n### Cons\n\n- Frontmatter rules are check-only until an expectation kind exists for them.\n- A busy-looping fixer hangs the run, because there is no sandbox.\n"},"PRS-0021":{"file":"0021-plugins-declare-their-categories.md","status":"accepted","title":"A plugin adds a category by declaring it","markdown":"<!-- GENERATED from PRS-0021 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A category is a claim about what a group of rules guards.\n> A rule that names a category nobody declared is a typo until proven otherwise.\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (categories are declared in the plugin's meta)\n- Extends [PRS-0011](0011-rules-carry-a-category.md) (PRS-0011 says a rule that fits no category calls for a new one, and this is how a plugin makes one)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (a local rule file declares its word by exporting categories)\n\n## Problem\n\n### Symptom\n\nCATEGORIES was a closed list of three words.\n\n### Pain point\n\nA plugin whose rules guard frontmatter had to call them sentence rules or leave them ungrouped.\n\n## Decision\n\n### The lens\n\n- **Given**: a plugin has rules that fit none of sentence, list or punctuation\n- **We prefer**: a declared category, a word plus a one-line description in meta.categories, over free text in each rule\n- **Because**: a declaration is the one place a word can be checked and described\n- **Unless**: two plugins want the same word, which today is a load error naming both\n\n### In practice\n\n- A category is one lower-case word.\n- sentence, list and punctuation are built in. A plugin may use them without declaring them and may not declare them.\n- A plugin may use a new word only if it declares that word itself. It cannot borrow another plugin's.\n- A word declared by two plugins fails the load and names both.\n- A local rule file may export categories. Local files share the namespace local, so they may repeat a word with the same description.\n- The category word appears in --list-rules with its description.\n\n## Consequences\n\n### Pros\n\n- A misspelt category fails at load instead of making a group of one.\n- Help output reads the same for a plugin as for a built-in.\n\n### Cons\n\n- Two plugins that want a shared category word cannot, until a shared declaration exists.\n"},"PRS-0022":{"file":"0022-plugins-load-automatically.md","status":"accepted","title":"Plugins and local rules load on their own from declared sources","markdown":"<!-- GENERATED from PRS-0022 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Zero setup is worth having, and running a repository's code is the price.\n> The price has to be visible every time, and there has to be a way to refuse it.\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (discovery finds modules that have the plugin shape)\n- Depends on [PRS-0021](0021-plugins-declare-their-categories.md) (a local file declares its category by exporting it)\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (the config can list extra plugins or switch them all off)\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the loader runs under the Node bundle and uses no Bun global)\n- Extended by [PRS-0025](0025-plugin-loading-strictness.md) (a skip is now an explicit, reported choice rather than never allowed)\n- Depended on by [PRS-0026](0026-typescript-local-rules-need-a-runtime-that-imports-them.md) (a local file may be TypeScript where the runtime can import it)\n\n## Problem\n\n### Symptom\n\nA rule set that a user could not extend, and a proposal that made extending it a manual wiring job.\n\n### Pain point\n\nRunning a markdown linter in a cloned repository now runs that repository's code, which nobody expects of a linter.\n\n## Decision\n\n### The lens\n\n- **Given**: a project has local rule files or depends on a prose-gates plugin\n- **We prefer**: loading both with no config and saying so on every run, over a config that must list them\n- **Because**: a project that depends on a plugin has already chosen it\n- **Unless**: the run is on a repository that is not trusted, which --no-plugins is for\n\n### In practice\n\n- Sources load in this order, local files, then declared packages by name, then entries in the config.\n- Local rules are .js or .mjs files in .prose-gates/rules, under the namespace local. A .ts file there fails with the reason.\n- A package is read from dependencies, devDependencies and optionalDependencies of the root package.json, never from a scan of node_modules.\n- A name matches ^(@scope/)?prose-gates-plugin(-name)?$, so prose-gates-plugin-acme and @acme/prose-gates-plugin-acme both match.\n- A matching dependency that is not installed fails the run with its name. There is no skipped plugin.\n- A package that is listed twice loads once.\n- A run prints one stderr line naming each namespace and its rule count, and --json carries the same list.\n- Passing --no-plugins, or setting plugins to false, runs built-ins only and prints what was skipped.\n- There is no sandbox, no trust prompt and no pinning. A typosquatted dependency name would run.\n\n## Consequences\n\n### Pros\n\n- A project gains a rule by adding a file or a dependency.\n- A reviewer can see in any log what ran.\n\n### Cons\n\n- Cloning an untrusted repository and running the CLI can run its code, unless --no-plugins is given.\n- A trust prompt or an allow list would close this and is a later record.\n"},"PRS-0023":{"file":"0023-frontmatter-is-a-read-only-view.md","status":"accepted","title":"Frontmatter is a read-only view that built-in rules never see","markdown":"<!-- GENERATED from PRS-0023 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Frontmatter is metadata for tools, so prose rules were right to ignore it.\n> A rule about an agent skill's description needs to read exactly that.\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule reads the view through the model it is handed)\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the view is derived from the tree parsed once)\n- Extended by [PRS-0028](0028-frontmatter-edits-are-verified-by-data-equality.md) (a frontmatter edit is now allowed when the data is unchanged)\n\n## Problem\n\n### Symptom\n\nFrontmatter parsed to an opaque yaml node and no rule could read a key or report its line.\n\n### Pain point\n\nA hand-written key scanner would mishandle quoted and folded scalars, and a fixer must never guess.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule needs the keys and values of a leading metadata block\n- **We prefer**: the yaml package, read lazily, exposed as entries with a line and source offsets, over a scanner of our own\n- **Because**: correct ranges for quoted, folded and literal scalars are the yaml package's job\n- **Unless**: a rule needs nested keys or TOML, which calls for a new record\n\n### In practice\n\n- Only the first node of the document can be frontmatter, and only YAML is read.\n- An entry is a top-level key whose value is a string. Numbers, booleans, lists and nested maps are left out.\n- The view is read on first use, so a document with invalid YAML fails only a rule that asks for it.\n- Invalid YAML throws with the file line, and a plugin rule that throws becomes a finding for that rule.\n- Built-in prose rules still never read frontmatter, and verification still counts its words.\n- No expectation kind fits an edit inside a yaml node, so frontmatter rules are check-only.\n\n## Consequences\n\n### Pros\n\n- The skills description budget works on a real SKILL.md with one rule file.\n- Frontmatter in a markdown fence is checked like a top-level block, with no extra code.\n\n### Cons\n\n- The package gains its first dependency that is not part of the mdast family.\n- TOML frontmatter and nested keys are out of reach until another record.\n"},"PRS-0024":{"file":"0024-failures-are-named-errors-with-codes.md","status":"accepted","title":"Every deliberate failure is a named error class with a stable code","markdown":"<!-- GENERATED from PRS-0024 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A message is for a person, and a type is for a program.\n> A wrapper that must tell a bad config from a bad plugin should not parse prose.\n\n## Relates to\n\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (the config failures it names are the ones the config file can raise)\n- Depended on by [PRS-0025](0025-plugin-loading-strictness.md) (lenient loading branches on the plugin error classes)\n\n## Problem\n\n### Symptom\n\nEvery config failure was a UsageError with a different message, so a caller could only tell them apart by reading the text.\n\n### Pain point\n\nA plugin failure and a config failure looked alike, and a retired rule id and a bad option had no common handling.\n\n## Decision\n\n### The lens\n\n- **Given**: a run can fail because of the invocation, the config, a plugin source or a plugin fixer\n- **We prefer**: one error class per cause, each with a stable code and the fields a tool needs, over one class with several messages\n- **Because**: a type can be branched on and a message cannot be relied on to stay the same\n- **Unless**: a new cause has no class yet, which means adding one rather than reusing a near match\n\n### In practice\n\n- A UsageError exits 2, and covers flags and config. Its subclasses are FlagError, ConfigFileError, ConfigNotFoundError, AmbiguousConfigError, ConfigShapeError, RuleSettingError, UnknownRuleError and RuleOptionError.\n- A PluginLoadError exits 1, and covers a source that failed to load. Its subclasses are PluginImportError, PluginContractError, PluginConflictError, PluginNotInstalledError and PluginSourceError.\n- PluginFixerError is raised while a run is in progress and always stops it.\n- A code is stable kebab-case, such as unknown-rule or plugin-contract, and is shown as error[code] on stderr.\n- A class carries what a tool needs, such as the rule, the option, the file, the source or the other plugin in a clash.\n- A message keeps its wording where a test or a user may match it, so adding a class does not rename a failure.\n\n## Consequences\n\n### Pros\n\n- A wrapper can branch on the type or the code instead of parsing a message.\n- The same codes appear in stderr, in --validate-plugins output and in --json.\n\n### Cons\n\n- A new failure needs a class and a code, which is more to write than a message.\n- A code is public, so renaming one breaks a wrapper.\n"},"PRS-0025":{"file":"0025-plugin-loading-strictness.md","status":"accepted","title":"Strict loading is the default, lenient and validated loading are opt-in and loud","markdown":"<!-- GENERATED from PRS-0025 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A plugin that fails is a rule that did not run, and that must never look like a clean document.\n> Some teams still want the plugins that work to keep working while one is repaired.\n\n## Relates to\n\n- Extends [PRS-0022](0022-plugins-load-automatically.md) (PRS-0022 said there is no skipped plugin, and this makes a skip an explicit choice that is still reported)\n- Depends on [PRS-0024](0024-failures-are-named-errors-with-codes.md) (lenient loading and validation branch on the plugin error classes)\n\n## Problem\n\n### Symptom\n\nOne broken plugin stopped every run, and there was no way to check a plugin setup without checking a document.\n\n### Pain point\n\nA team could not keep linting while a plugin was fixed, and CI could not validate plugins before any document existed.\n\n## Decision\n\n### The lens\n\n- **Given**: a plugin fails to load\n- **We prefer**: strict by default, with --lenient-plugins and --validate-plugins as opt-ins that still say what happened, over a silent skip\n- **Because**: a skip that is named is a decision, and a skip that is silent is a bug\n- **Unless**: a project sets pluginLoading to lenient in its config, which is the same choice made once\n\n### In practice\n\n- Strict stops the run with the named error, and it is the default.\n- Lenient leaves out only the source that failed, prints one stderr line with its code, and runs the rest. The built-in rules always run.\n- A setting in the config for a rule of a skipped plugin is dropped with a line saying so. A typo in a built-in id still fails.\n- When two plugins clash, the first keeps the namespace and the later one is skipped.\n- A validation run uses the collect mode, loads every source, reports every failure together, and runs no check and no fix.\n- A validation run exits 0 when every source is valid, 1 when any fails, and 2 for a config problem. It takes no files.\n- Lenient with --no-plugins is a contradiction and a flag error.\n\n## Consequences\n\n### Pros\n\n- CI can validate a plugin setup before any document is read.\n- A broken plugin no longer blocks the rest of a team's checks, when they choose that.\n\n### Cons\n\n- A lenient run can pass while a rule did not run, so the stderr line is the only signal and must be read.\n- Lenient loading is not a safety option, because every plugin that loads still runs.\n"},"PRS-0026":{"file":"0026-typescript-local-rules-need-a-runtime-that-imports-them.md","status":"accepted","title":"A local rule may be TypeScript where the runtime can import it","markdown":"<!-- GENERATED from PRS-0026 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: Authors of rules for TypeScript projects write TypeScript.\n> Transpiling it ourselves would add a compiler to a tool that is meant to be small.\n\n## Relates to\n\n- Depends on [PRS-0022](0022-plugins-load-automatically.md) (local files are one of the sources discovery finds)\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the Node bundle imports the rule with the runtime it is given and uses no Bun global)\n\n## Problem\n\n### Symptom\n\nA .ts file in .prose-gates/rules failed with a message that said to write JavaScript.\n\n### Pain point\n\nA TypeScript project had to keep its lint rules in a different language from the rest of its code.\n\n## Decision\n\n### The lens\n\n- **Given**: a local rule is written in TypeScript\n- **We prefer**: importing it as it is and requiring a runtime that can, over bundling a transpiler\n- **Because**: Bun and recent Node strip types natively, and a transpiler is a dependency we would own\n- **Unless**: a runtime cannot import TypeScript, which is a named plugin-source error that says how to fix it\n\n### In practice\n\n- A .ts or .mts file loads under Bun, and under Node 22.18 or newer, which strips types by default.\n- The check is process.versions.bun or process.features.typescript, so no Bun global is used.\n- A .cts file is refused, because the loader imports ES modules. A .d.ts file is ignored.\n- bunx runs the package's own node shebang, so bunx --bun is how to run under Bun.\n- Node only strips types, so a rule uses erasable syntax, with no enums and no parameter properties.\n- A failure is a PluginSourceError with the code plugin-source, and a lenient run skips only that file.\n\n## Consequences\n\n### Pros\n\n- A rule can share types and idioms with the project it checks.\n- There is no compiler in the dependency list.\n\n### Cons\n\n- A rule that needs enums or other non-erasable syntax does not run under Node without a flag.\n- Node 20 cannot run a TypeScript rule at all.\n"},"PRS-0027":{"file":"0027-rules-may-be-async.md","status":"accepted","title":"Rules may be async, checks run concurrently, and fixers run in priority order","markdown":"<!-- GENERATED from PRS-0027 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A rule that calls a tool or a service has to wait, and the engine should not stop to wait with it.\n> A fix run must still end at a text that fixing again would not change.\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule function may now return a promise)\n- Depends on [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (an async fixer meets the same verification as a sync one)\n\n## Problem\n\n### Symptom\n\nCheck and fix were synchronous, so a rule could not wait on anything.\n\n### Pain point\n\nA rule that needed a tool or a service had to block. A bare list gave no way to say what a run guaranteed.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule may wait, and one invocation should end at a stable text\n- **We prefer**: async engines, with concurrent checks and sequential fixers in a hand-kept list, over declared order properties or a staged fold\n- **Because**: concurrency is as good as parallelism here, and the restart loop is what makes the result stable\n- **Unless**: the cost of asking earlier fixers again becomes real, which calls for a faster loop and a new record\n\n### In practice\n\n- checkMarkdown, checkModel, fixMarkdown, fixMarkdownReport and the testing helpers return promises.\n- A rule's check and fix may return a value or a promise, and a built-in stays synchronous.\n- Every check starts at once and the engine waits for all of them. JavaScript runs one thread, so this is concurrency and not parallelism.\n- Findings are sorted by line and then by id after every check has finished, so the order the rules finish in never shows.\n- A fixer is awaited before the next is asked, because each fixer must see the text the last one left.\n- A rejected check becomes a finding for that rule. A rejected fixer stops the run with a PluginFixerError.\n- The fix loop restarts from the top after every accepted edit, so an earlier fixer is asked again about text a later one changed.\n- One invocation therefore ends at a stable text, and fixing the output again changes nothing.\n- A rule declares no phase and no after or before constraint, because sampled random fixer orders reproduce every documented output.\n\n## Consequences\n\n### Pros\n\n- A plugin can call a tool or a service without blocking the other checks.\n- The stable-text guarantee is a property of the loop and is checked by tests.\n\n### Cons\n\n- The library API is async, which changes every caller before the first release.\n- Asking every earlier fixer again after each accepted edit does not scale to hundreds of rules over hundreds of files.\n- Fixers cannot overlap, so a slow fixer delays the ones after it.\n"},"PRS-0028":{"file":"0028-frontmatter-edits-are-verified-by-data-equality.md","status":"accepted","title":"A frontmatter edit is verified by comparing the YAML data before and after","markdown":"<!-- GENERATED from PRS-0028 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A fixer that rewrites frontmatter changes how data is written, and the data must not move.\n> Words are not enough to prove that, because a full stop or a key order is data and not a word.\n\n## Relates to\n\n- Extends [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (PRS-0023 made frontmatter check-only because no expectation fit, and this adds one that does)\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint still runs first and a lost word still throws)\n\n## Problem\n\n### Symptom\n\nFrontmatter rules could only report, and could reach only top-level keys.\n\n### Pain point\n\nA rule about an agent skill needs a nested description, and a useful fixer needs to change how a value is written without changing it.\n\n## Decision\n\n### The lens\n\n- **Given**: a fixer rewrites the frontmatter\n- **We prefer**: an expectation that proves the YAML data is identical and nothing outside it moved, over banning frontmatter fixers or trusting them\n- **Because**: parsing before and after is a stronger proof than any text comparison, and it is cheap\n- **Unless**: a fixer needs to change the data, which has no expectation and is refused\n\n### In practice\n\n- The expectation is same-frontmatter-data. The engine parses the leading YAML of the tree before and after and compares the results as JSON.\n- Any difference in data, including key order, refuses the edit. A block that no longer parses refuses it.\n- The tree without its frontmatter must be equal before and after, so an edit cannot move the body.\n- The fingerprint check still runs first, so a changed word throws before data is compared.\n- The view carries the whole parsed document and the top-level entries.\n- It also lists every string scalar at any depth, with a path, the nearest key, a line, offsets, a style and an indent.\n- A number, a boolean and an alias are not in the scalars, and an alias is not followed.\n- A rule matching the key description therefore checks a nested description and one inside a list.\n\n## Consequences\n\n### Pros\n\n- A plugin can fix frontmatter and the engine proves the data did not change.\n- A rule can reach any string in the YAML without a parser of its own.\n\n### Cons\n\n- The package exposes the yaml package's Document type in its API.\n- Reordering keys is refused, because order is data in the comparison.\n"},"PRS-0029":{"file":"0029-the-docs-site-is-assembled-from-the-real-documents.md","status":"accepted","title":"The docs site is assembled from the real documents and deploys only from main","markdown":"<!-- GENERATED from PRS-0029 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n> **Lens**: A docs site tempts a repo to move or copy its documents into one folder.\n> A copy that the gates never read, or a move that breaks the root meta-files, loses the guarantee that every published word was gated.\n\n## Problem\n\n### Symptom\n\nMkDocs serves one docs_dir, but the documents live at the root, in docs/ and in adrs/.\n\n### Pain point\n\nMoving them breaks the root meta-files and the generated records, and copying them lets a copy drift from the gated original.\n\n## Decision\n\n### The lens\n\n- **Given**: the documents are gated in place, the records are generated, and main changes only through pull requests\n- **We prefer**: a build step that copies the real documents into an untracked tree, over moving files or tracking a second copy\n- **Because**: the copy is rebuilt on every run and never edited, so the gates and the site always read the same words\n- **Unless**: a document needs site-only content, which then lives in the real file as an admonition or a tab\n\n### In practice\n\n- The site source is tmp/site-src, built by scripts/assemble-site.ts and never committed.\n- The copy keeps the repo layout, so a relative link between documents works on GitHub and on the site.\n- Links to the examples, the license and package.json become GitHub URLs, because the site does not carry those files.\n- The build runs mkdocs build --strict, so a broken link fails the pull request.\n- A pull request builds the site and never deploys it.\n- A push to main deploys through the github-pages environment.\n- The Publish workflow is unrelated and stays unchanged.\n- The site shows main, with no version selector, until a release needs older docs.\n\n## Consequences\n\n### Pros\n\n- The prose gates keep reading the real files, generated records included.\n- A broken link fails before merge.\n- No document moves, so no existing link or citation breaks.\n\n### Cons\n\n- The site build needs Bun and uv, where a plain MkDocs build needs only Python.\n- A link that leaves the published set must be listed in the assemble script.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle
  // only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived
  // rather than assigned: fill is the group, size is in-degree (how many records
  // refine or supersede this one). Status rides on the border, because usually only
  // a couple of records are superseded and a whole colour channel would be wasted.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its group colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // A status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"], node[status = "retired"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: 'node[status = "proposed"]',
        style: { "border-width": 2, "border-color": css("muted"), "border-opacity": 1, "border-style": "dotted" },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
