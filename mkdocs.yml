# The OsakaNights look comes from site-theme/osakanights/: the theme, palette,
# fonts and markdown extensions from its base config, and its stylesheet from
# custom_dir. A list set here replaces the base list, a mapping merges with it.
INHERIT: site-theme/osakanights/mkdocs.base.yml

site_name: jpai-prose-gates
site_description: Deterministic markdown gates and fixers for prose, with a plugin contract.
site_url: https://jpeakai.github.io/jpai-prose-gates/
repo_url: https://github.com/jpeakai/jpai-prose-gates
repo_name: jpeakai/jpai-prose-gates
edit_uri: edit/main/

# scripts/assemble-site.ts copies the repo's documents here with their layout
# intact. Edit the real files, never this directory.
docs_dir: tmp/site-src
site_dir: tmp/site

validation:
  nav:
    omitted_files: info

theme:
  custom_dir: site-theme/osakanights/overrides
  icon:
    repo: fontawesome/brands/github
  # A list, so it replaces the base features with this site's own set.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.tabs.link

# A mapping, so it merges with the base extensions rather than replacing them.
markdown_extensions:
  pymdownx.snippets:

nav:
  - Home: README.md
  - Rules:
      - RULES.md
  - Examples:
      - Fixes, before and after: docs/examples/fixes.md
      - Agent evals: docs/examples/agent-evals.md
  - Guides:
      - Plugins and local rules: docs/plugins.md
      - Check and fix engines: docs/engines.md
      - Language and concepts: docs/language.md
  - Reference:
      - Data model: docs/DATA_MODEL.md
      - Glossary: GLOSSARY.md
  - ADRs:
      - Index: adrs/index.md
      - Graph: adrs/graph.md
  - Project:
      - Documentation conventions: docs/CONVENTIONS.md
      - Publishing: docs/PUBLISHING.md
