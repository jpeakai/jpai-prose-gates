<script id="record-data" type="application/json">{"PRS-0001":{"file":"0001-parse-once-to-mdast.md","status":"accepted","title":"Every rule reads one mdast tree parsed once per file","markdown":"<!-- GENERATED from PRS-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [PRS-0012](0012-node-runs-a-published-bundle.md) (the Node bundle inlines the same parser)\n- Depended on by [PRS-0003](0003-splice-source-never-restringify.md) (splicing addresses source through the tree offsets)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the shared rule context derives from the model parsed once)\n- Depended on by [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (the frontmatter view is derived from the tree parsed once)\n\n## Decision\n\n### The lens\n\n#### Given\n\nseveral rules need to know which bytes are prose and which are structure\n\n#### We prefer\n\nparsing each file once with micromark into mdast and handing every rule the same model, over per-rule line scanning\n\n#### Because\n\nthe parser already implements CommonMark and GFM exactly, so exemptions come from node types rather than heuristics\n\n#### Unless\n\na rule needs something the tree loses, such as the original spacing, in which case it reads the source through node offsets\n\n## Consequences\n\n### Pros\n\n- Exemptions are consistent across every rule.\n- A new rule starts from structure rather than rebuilding it.\n\n### Cons\n\n- The package depends on the unified parser family.\n- A rule must map tree positions back to source offsets to edit anything.\n"},"PRS-0002":{"file":"0002-generated-markdown-is-gated.md","status":"accepted","title":"Generated markdown is gated like hand-written markdown","markdown":"<!-- GENERATED from PRS-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [PRS-0037](0037-a-check-reports-every-line-its-fixer-changes.md) (the stricter one-per-line check was met by fixing the record template)\n- Extended by [PRS-0038](0038-example-pages-are-rendered-from-fixtures-and-a-sweep-snapshot.md) (the Example Pages are generated markdown, gated like the rest)\n\n## Decision\n\n### The lens\n\n#### Given\n\na markdown file is produced by rendering a record or a template\n\n#### We prefer\n\ngating the rendered output and tracing each finding back to its source, over exempting generated paths\n\n#### Because\n\nthe reader sees the rendered page, so that page is what must meet the standard\n\n#### Unless\n\nthe generator's own boilerplate trips a rule, in which case the template is fixed rather than the rule relaxed\n\n## Consequences\n\n### Pros\n\n- The standard holds on every page a reader can open.\n- Template defects surface once and are fixed once.\n\n### Cons\n\n- A finding points at a file the contributor must not edit.\n"},"PRS-0003":{"file":"0003-splice-source-never-restringify.md","status":"accepted","title":"Fixes splice source slices and never re-stringify the tree","markdown":"<!-- GENERATED from PRS-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (slices are addressed through the offsets the parsed tree supplies)\n- Depended on by [PRS-0005](0005-every-fix-is-verified.md) (one spliced range is cheap to verify)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule wants to change a small part of a document\n\n#### We prefer\n\nsplicing a replacement built from source slices into the original text, over editing the tree and stringifying it\n\n#### Because\n\nevery byte outside the edit is preserved by construction, so the diff is exactly the fix\n\n#### Unless\n\nno source slice can express the change, in which case the rule refuses rather than generating markup\n\n## Consequences\n\n### Pros\n\n- Fix diffs are minimal and reviewable.\n- The fixer coexists with any other markdown formatter.\n\n### Cons\n\n- Each fixer must reason about offsets, escapes and line endings itself.\n- Overlapping edits cannot be combined and must wait for the next pass.\n"},"PRS-0004":{"file":"0004-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer refuses whenever the input is ambiguous","markdown":"<!-- GENERATED from PRS-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [PRS-0005](0005-every-fix-is-verified.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0007](0007-em-dash-becomes-parentheses-or-colon.md) (the em-dash fixer refuses every shape outside two)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (the refuses helper asserts untouched output)\n- Extended by [PRS-0041](0041-a-comma-run-of-code-spans-is-a-hidden-list.md) (list-comma-code-run refuses a run without a lead-in, mid-sentence, or opening inside markup)\n\n## Decision\n\n### The lens\n\n#### Given\n\na fixer cannot be sure its rewrite keeps the author's meaning\n\n#### We prefer\n\nrefusing and leaving the finding reported, over applying the most likely rewrite\n\n#### Because\n\nthe check still fails, so a human sees the case, while a wrong fix hides it permanently\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff line by line.\n\n### Cons\n\n- Some fixable prose stays reported until a human edits it.\n"},"PRS-0005":{"file":"0005-every-fix-is-verified.md","status":"accepted","title":"Every fix is verified against a content fingerprint and an expected shape","markdown":"<!-- GENERATED from PRS-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0003](0003-splice-source-never-restringify.md) (verification is cheap because an edit is a single spliced range)\n- Extends [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the engine refuses on behalf of a fixer that did not)\n- Depended on by [PRS-0006](0006-sentence-length-is-never-autofixed.md) (a length fix would change the fingerprint)\n- Tested by [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (properties assert the fingerprint is preserved)\n- Depended on by [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (a plugin fixer meets the same fingerprint and shape proof)\n- Depended on by [PRS-0028](0028-frontmatter-edits-are-verified-by-data-equality.md) (a new expectation compares YAML data before and after)\n- Extended by [PRS-0037](0037-a-check-reports-every-line-its-fixer-changes.md) (a fix never touches a paragraph the check passed)\n\n## Decision\n\n### The lens\n\n#### Given\n\nan edit is about to be written back to a file\n\n#### We prefer\n\nreparsing the result and comparing its words, urls and code to the original, over trusting the fixer's own logic\n\n#### Because\n\na changed fingerprint is a tool bug that must fail loudly, while a shape mismatch is an unforeseen case\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A fixer bug surfaces as a crash instead of a silent content change.\n\n### Cons\n\n- Every edit costs a reparse of the document.\n- The fingerprint must know which tokens a fix may legitimately remove.\n"},"PRS-0006":{"file":"0006-sentence-length-is-never-autofixed.md","status":"accepted","title":"Sentence length is reported and never autofixed","markdown":"<!-- GENERATED from PRS-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint forbids the word changes a length fix would need)\n- Extended by [PRS-0010](0010-length-findings-guide-a-split.md) (the message estimates clauses to guide a split)\n- Extended by [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (a long paragraph is reported the same way, with no fixer)\n- Depended on by [PRS-0035](0035-finding-messages-are-measured-by-agent-evals.md) (agent evals target the rules a fixer never touches)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence exceeds the word budget\n\n#### We prefer\n\nreporting the finding for a human to rewrite, over any mechanical split or trim\n\n#### Because\n\nevery shortening changes words, and the fingerprint rightly rejects any fix that changes words\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- The fixer never rewrites meaning.\n\n### Cons\n\n- A fix run can finish with findings left, so CI still fails until a human edits.\n"},"PRS-0007":{"file":"0007-em-dash-becomes-parentheses-or-colon.md","status":"accepted","title":"An em-dash pair becomes parentheses and a lone em-dash becomes a colon","markdown":"<!-- GENERATED from PRS-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (every pattern outside the two shapes is refused)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence in prose contains an em-dash\n\n#### We prefer\n\nreplacing a pair with parentheses and a single dash with a colon, over reporting every dash for a manual rewrite\n\n#### Because\n\nthose two shapes have one reading each, so the replacement keeps the meaning\n\n#### Unless\n\nthe dash touches punctuation, sits between digits, shares a sentence with a colon, or brackets a marker\n\n## Consequences\n\n### Pros\n\n- The most common glyph finding clears without a human.\n\n### Cons\n\n- The rule carries a growing list of refusal conditions.\n"},"PRS-0008":{"file":"0008-one-file-per-rule.md","status":"accepted","title":"Each rule lives in its own file with its check and its fix together","markdown":"<!-- GENERATED from PRS-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [PRS-0011](0011-rules-carry-a-category.md) (rules also carry a category, as a field rather than a folder)\n- Depended on by [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context is what a rule module receives in both halves)\n- Depended on by [PRS-0016](0016-modules-group-by-what-a-function-takes.md) (a helper leaves its rule module for the layer whose data it takes)\n- Extended by [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (the id a rule file is named by is now category-short-name)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule is the same unit, a check with an optional fix)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe package holds several independent rules that each gain a fixer\n\n#### We prefer\n\none module per rule named by id and slug, with shared machinery in src/fix, over grouping rules by theme in larger files\n\n#### Because\n\nthe rule id is how findings, tests and fixtures are named, so the file tree mirrors it\n\n#### Unless\n\ntwo rules share a detector, in which case the detector moves to its own module, as interpunct.ts does\n\n## Consequences\n\n### Pros\n\n- A rule and its tests can be read without the rest of the package.\n\n### Cons\n\n- Fix ordering lives in the engine, away from the rules it orders.\n"},"PRS-0009":{"file":"0009-adversarial-and-property-tests-gate-fixes.md","status":"accepted","title":"Adversarial and property tests gate every change to fix behaviour","markdown":"<!-- GENERATED from PRS-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Tests [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (the refuses helper asserts untouched output)\n- Tests [PRS-0005](0005-every-fix-is-verified.md) (properties assert the fingerprint is preserved)\n- Depended on by [PRS-0037](0037-a-check-reports-every-line-its-fixer-changes.md) (the one-per-line gap was reproduced by an adversarial test before its fix)\n\n## Decision\n\n### The lens\n\n#### Given\n\na change touches how any rule fixes prose\n\n#### We prefer\n\nexact fixtures, adversarial suites and generated property tests together, over example tests alone\n\n#### Because\n\neach layer catches a class of bug the others miss, and a regression becomes a named test\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A fixer bug usually fails a property before it reaches a document.\n\n### Cons\n\n- The suite is slower than example tests alone.\n- A property counterexample can take time to shrink into a readable test.\n"},"PRS-0010":{"file":"0010-length-findings-guide-a-split.md","status":"accepted","title":"A sentence length finding estimates clauses to guide a split","markdown":"<!-- GENERATED from PRS-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0006](0006-sentence-length-is-never-autofixed.md) (the rule stays report-only, and its message now carries the guidance a human or agent needs)\n- Extended by [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (the paragraph finding counts topics to guide a break)\n- Extended by [PRS-0034](0034-clauses-count-verb-phrases-as-well-as-markers.md) (the clause count also reads the verb phrases compromise finds)\n- Extended by [PRS-0035](0035-finding-messages-are-measured-by-agent-evals.md) (agent evals measure how well the clause guidance closes the loop)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence exceeds the word budget and a human or an agent must rewrite it\n\n#### We prefer\n\nreporting potential clauses and a target sentence count, over reporting the word count alone\n\n#### Because\n\na count of clauses names where the sentence can split, which makes splitting easier than compressing\n\n#### Unless\n\na real parser becomes deterministic enough to replace the heuristic, which would supersede the counting method only\n\n## Consequences\n\n### Pros\n\n- Rewrites keep their connective words and read as prose.\n- The message stays deterministic, with no model or dependency.\n\n### Cons\n\n- The heuristic overcounts lists and undercounts clauses joined without a marker word.\n"},"PRS-0011":{"file":"0011-rules-carry-a-category.md","status":"accepted","title":"Each rule carries a category, and RULES.md is held true by a test","markdown":"<!-- GENERATED from PRS-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0008](0008-one-file-per-rule.md) (a category is a field on the rule module, never a folder, so files stay named by rule id)\n- Extended by [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (the category is now the first word of a rule id)\n- Extended by [PRS-0021](0021-plugins-declare-their-categories.md) (a plugin adds a category by declaring it)\n\n## Decision\n\n### The lens\n\n#### Given\n\nrules need grouping and each fix needs a concrete example\n\n#### We prefer\n\na category field on every rule and a RULES.md whose examples a test replays, over hand-maintained tables\n\n#### Because\n\na replayed example cannot claim a fix the engine does not make\n\n#### Unless\n\na rule fits no category, which calls for a new category rather than a catch-all\n\n## Consequences\n\n### Pros\n\n- The documentation fails the build the moment a fixer changes its output.\n\n### Cons\n\n- Examples in RULES.md are limited to a text fence with a label in its info string.\n"},"PRS-0012":{"file":"0012-node-runs-a-published-bundle.md","status":"accepted","title":"Node runs a bundle built at publish time, and Bun runs the source","markdown":"<!-- GENERATED from PRS-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the bundle inlines the mdast parser, so Node needs no dependency install)\n- Depended on by [PRS-0013](0013-releases-publish-from-github-actions.md) (the publish workflow ships this bundle)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (the plugin loader runs under the Node bundle)\n- Depended on by [PRS-0026](0026-typescript-local-rules-need-a-runtime-that-imports-them.md) (the Node bundle imports a TypeScript rule with the runtime it is given)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe package is consumed by both Bun and Node projects\n\n#### We prefer\n\npublishing to npm with a bundle built at pack time, over committing the bundle for git installs\n\n#### Because\n\na committed bundle adds a regenerated file of about 300 kilobytes to every source change, and a registry install needs no allow-git opt-in\n\n#### Unless\n\nthe package must be installed from git, where no build step runs and the bundle would have to be committed\n\n## Consequences\n\n### Pros\n\n- npx, bunx and a dev dependency all run with one runtime installed.\n- Source changes carry no generated bundle in their diff.\n\n### Cons\n\n- Publishing needs an npm account and a manual release step.\n"},"PRS-0013":{"file":"0013-releases-publish-from-github-actions.md","status":"accepted","title":"Releases publish to npm from GitHub Actions through trusted publishing","markdown":"<!-- GENERATED from PRS-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the workflow publishes the bundle that PRS-0012 builds at pack time)\n- Extended by [PRS-0014](0014-main-changes-only-through-pull-requests.md) (only main can start the workflow and only main can reach npm)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe package is public on npm under the jpeakai org\n\n#### We prefer\n\na workflow_dispatch workflow using npm trusted publishing, over publishing from a laptop or with an NPM_TOKEN secret\n\n#### Because\n\ntrusted publishing needs no stored secret, and provenance ties each version to the workflow run that built it\n\n#### Unless\n\nnpm drops trusted publishing, where a granular automation token in a protected environment replaces it\n\n## Consequences\n\n### Pros\n\n- A release is a version bump, a push and one workflow run.\n- Each version carries provenance that npm shows on the package page.\n\n### Cons\n\n- GitHub Actions never renders the decision bundle, so a stale bundle is caught only locally.\n"},"PRS-0014":{"file":"0014-main-changes-only-through-pull-requests.md","status":"accepted","title":"Main changes only through pull requests, and releases run only from main","markdown":"<!-- GENERATED from PRS-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0013](0013-releases-publish-from-github-actions.md) (the Publish workflow stays, and now only main can start it and only main can reach npm)\n\n## Decision\n\n### The lens\n\n#### Given\n\nmain is the only source of releases, and the package is public on npm\n\n#### We prefer\n\nbranch protection with required checks, plus a main-only environment, over trusting every push and dispatch\n\n#### Because\n\nnpm trusted publishing checks the repo and workflow file but never the branch, so GitHub must refuse other branches\n\n#### Unless\n\nthe repo gains outside maintainers, where a required review is added to the protection\n\n## Consequences\n\n### Pros\n\n- Every commit on main has passed CI before it can be released.\n- A branch cannot publish, even with an edited copy of the workflow.\n\n### Cons\n\n- A release takes two steps, a merged version bump and a workflow run.\n"},"PRS-0015":{"file":"0015-a-rule-reads-one-shared-context.md","status":"accepted","title":"A check and a fix both read one context built once per document","markdown":"<!-- GENERATED from PRS-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (the context is the argument the one-file-per-rule contract passes to both halves)\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the shared data is derived from the model parsed once)\n- Depended on by [PRS-0016](0016-modules-group-by-what-a-function-takes.md) (where the code that reads the context lives)\n- Depended on by [PRS-0018](0018-config-file-and-rule-control.md) (the registry decides which runs count as reported inside the context)\n- Extended by [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (a rule may also read the findings of the categories it runs after)\n\n## Decision\n\n### The lens\n\n#### Given\n\nseveral rules depend on data derived from the whole document rather than from one paragraph\n\n#### We prefer\n\nderiving that data once per document into a RuleContext both halves receive, over letting each half compute what it needs\n\n#### Because\n\nshared data is the only way the agreement between a check and its fix is structural rather than reviewed\n\n#### Unless\n\nthe data is local to one rule, which keeps it inside that module\n\n## Consequences\n\n### Pros\n\n- The fixpoint loop derives the runs once per pass rather than once per rule.\n- A rule module reads as data in, findings or edits out.\n\n### Cons\n\n- Shared data is computed for every document, including one no rule will read it for.\n"},"PRS-0016":{"file":"0016-modules-group-by-what-a-function-takes.md","status":"accepted","title":"A module groups functions by what they take, not by who calls them","markdown":"<!-- GENERATED from PRS-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the context says what a rule is handed, and this says where the code that reads it lives)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a helper leaves its rule module only once a second rule needs it)\n- Depended on by [PRS-0031](0031-code-complexity-is-gated-by-biome.md) (a function split for the complexity limits places its helpers by this rule)\n\n## Decision\n\n### The lens\n\n#### Given\n\nshared code has to live somewhere a reader can predict\n\n#### We prefer\n\ngrouping by the data a function takes, over grouping by which half of a rule calls it\n\n#### Because\n\nthe arguments are visible in the signature, while the callers are not\n\n#### Unless\n\na derivation has its own vocabulary, which earns it a named module of its own\n\n## Consequences\n\n### Pros\n\n- src/rules/ holds the contract, the catalogue and the nine gates, and nothing else.\n- A module name is checkable, because a reader confirms it from the signatures inside rather than by finding the callers.\n\n### Cons\n\n- The move rewrote every import in the package at once.\n- Sharing a helper costs an import edge where duplication cost none, so a rule now names more modules than it did.\n"},"PRS-0017":{"file":"0017-rule-ids-are-category-and-short-name.md","status":"accepted","title":"A rule id is its category followed by a short name","markdown":"<!-- GENERATED from PRS-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0008](0008-one-file-per-rule.md) (a rule file is still named by its id, and the id is now category-short-name instead of pgNNN-slug)\n- Extends [PRS-0011](0011-rules-carry-a-category.md) (the category a rule carries is the first word of its id)\n- Depended on by [PRS-0018](0018-config-file-and-rule-control.md) (a config names a rule by its id)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin id is the namespace in front of category-short-name)\n- Depended on by [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (the paragraph category was added for a rule no category fit)\n\n## Decision\n\n### The lens\n\n#### Given\n\nevery finding, fixture, heading and test names a rule by its id\n\n#### We prefer\n\nan id of one lower-case category word and a three or four word short name, joined by hyphens, over a sequential number\n\n#### Because\n\nthe id then says what the rule guards before anyone looks it up\n\n#### Unless\n\na new rule fits no existing category, which calls for a new category rather than a catch-all word\n\n## Consequences\n\n### Pros\n\n- A finding line explains itself.\n- Files sort by category in a directory listing.\n\n### Cons\n\n- Ids are longer in help output and tables.\n- Accepted records written before this one still say PG001 to PG009.\n"},"PRS-0018":{"file":"0018-config-file-and-rule-control.md","status":"accepted","title":"An optional config file switches rules off and sets their options","markdown":"<!-- GENERATED from PRS-0018 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0015](0015-a-rule-reads-one-shared-context.md) (the registry decides which interpunct runs count as reported, inside the shared context)\n- Depends on [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (a config names a rule by its category-short-name id, and a retired PG id is an unknown id)\n- Depended on by [PRS-0019](0019-plugin-contract-and-namespace.md) (plugin rules are switched off and given options through the same file)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (the config can list extra plugins or turn all of them off)\n- Depended on by [PRS-0024](0024-failures-are-named-errors-with-codes.md) (the config failures it raises are named errors with codes)\n- Depended on by [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (maxSentences is checked at load like maxWords)\n- Extended by [PRS-0036](0036-a-glossary-is-read-as-the-concept-model.md) (a concept file at the project root also shapes a run, and fails it the way a bad config does)\n- Extended by [PRS-0042](0042-plain-word-runs-and-a-min-items-option.md) (every list run rule takes a minItems option, checked at load)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project wants to disable a rule, tune its budget, or run extra rules\n\n#### We prefer\n\nan optional config at the project root, validated against the loaded rules, over flags alone or a silent skip of unknown names\n\n#### Because\n\na config that is checked at load cannot drift from the rules it names\n\n#### Unless\n\na setting needs more than a severity and a typed option, which calls for a new record\n\n## Consequences\n\n### Pros\n\n- A typo in a rule id fails the run instead of doing nothing.\n- Switching a list rule off never leaves a run that no rule reports.\n\n### Cons\n\n- The project root is a heuristic, the nearest ancestor with a package.json, a config or a .prose-gates directory.\n- A second config format needs a new record, because .json and .mjs are the only two read.\n"},"PRS-0019":{"file":"0019-plugin-contract-and-namespace.md","status":"accepted","title":"A plugin rule is a built-in rule with a namespace, and the plugin names it","markdown":"<!-- GENERATED from PRS-0019 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (plugin rules join the registry and answer to the same config)\n- Depends on [PRS-0008](0008-one-file-per-rule.md) (a plugin rule is the same unit, a check with an optional fix)\n- Depends on [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (a rule key is category-short-name and the id adds the namespace in front)\n- Depended on by [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (fixers from a plugin are held to the same proof)\n- Depended on by [PRS-0021](0021-plugins-declare-their-categories.md) (a plugin declares its categories in its meta)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (discovery finds modules that have this shape)\n- Depended on by [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (the frontmatter view is part of the model a plugin rule reads)\n- Depended on by [PRS-0027](0027-rules-may-be-async.md) (a plugin rule function may return a promise)\n- Extended by [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (a plugin rule reads each paragraph's language view)\n- Extended by [PRS-0036](0036-a-glossary-is-read-as-the-concept-model.md) (a plugin rule reads the project's concepts from the document)\n\n## Decision\n\n### The lens\n\n#### Given\n\na user wants a rule this package does not ship\n\n#### We prefer\n\na plugin whose default export is { meta, rules }, with rules receiving the built-in context, over a second rule interface\n\n#### Because\n\none contract means the engine, the fixer proof and the config treat every rule alike\n\n#### Unless\n\nthe contract must change in a way a plugin would notice, which bumps apiVersion\n\n## Consequences\n\n### Pros\n\n- A plugin rule is switched off, given options and listed exactly like a built-in.\n- A plugin cannot clash with a built-in id, because a core id has no slash.\n\n### Cons\n\n- A throwing built-in still crashes the run, while a throwing plugin rule does not, so the two are not treated alike.\n- apiVersion is one integer, so any breaking change fails every plugin until it is updated.\n"},"PRS-0020":{"file":"0020-plugin-fixers-stay-under-verification.md","status":"accepted","title":"A plugin fixer is held to the same proof as a built-in one","markdown":"<!-- GENERATED from PRS-0020 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin fixer is part of the plugin contract)\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint and the expected shape are the proof a plugin fixer meets)\n- Depended on by [PRS-0027](0027-rules-may-be-async.md) (an async fixer meets the same verification)\n\n## Decision\n\n### The lens\n\n#### Given\n\na plugin proposes edits to a document\n\n#### We prefer\n\nallowing the fixer and applying the verification every built-in meets, over banning plugin fixers\n\n#### Because\n\na word lost or added throws, a structure that is not as declared is refused, and neither depends on who wrote the fixer\n\n#### Unless\n\nno expectation kind fits the edit, as with an edit inside frontmatter, in which case it is refused\n\n## Consequences\n\n### Pros\n\n- A plugin fixer can never change what a document says.\n- Hostile fixers are covered by adversarial tests rather than by review.\n\n### Cons\n\n- Frontmatter rules are check-only until an expectation kind exists for them.\n- A busy-looping fixer hangs the run, because there is no sandbox.\n"},"PRS-0021":{"file":"0021-plugins-declare-their-categories.md","status":"accepted","title":"A plugin adds a category by declaring it","markdown":"<!-- GENERATED from PRS-0021 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (categories are declared in the plugin's meta)\n- Extends [PRS-0011](0011-rules-carry-a-category.md) (PRS-0011 says a rule that fits no category calls for a new one, and this is how a plugin makes one)\n- Depended on by [PRS-0022](0022-plugins-load-automatically.md) (a local rule file declares its word by exporting categories)\n\n## Decision\n\n### The lens\n\n#### Given\n\na plugin has rules that fit none of sentence, list or punctuation\n\n#### We prefer\n\na declared category, a word plus a one-line description in meta.categories, over free text in each rule\n\n#### Because\n\na declaration is the one place a word can be checked and described\n\n#### Unless\n\ntwo plugins want the same word, which today is a load error naming both\n\n## Consequences\n\n### Pros\n\n- A misspelt category fails at load instead of making a group of one.\n- Help output reads the same for a plugin as for a built-in.\n\n### Cons\n\n- Two plugins that want a shared category word cannot, until a shared declaration exists.\n"},"PRS-0022":{"file":"0022-plugins-load-automatically.md","status":"accepted","title":"Plugins and local rules load on their own from declared sources","markdown":"<!-- GENERATED from PRS-0022 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (discovery finds modules that have the plugin shape)\n- Depends on [PRS-0021](0021-plugins-declare-their-categories.md) (a local file declares its category by exporting it)\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (the config can list extra plugins or switch them all off)\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the loader runs under the Node bundle and uses no Bun global)\n- Extended by [PRS-0025](0025-plugin-loading-strictness.md) (a skip is now an explicit, reported choice rather than never allowed)\n- Depended on by [PRS-0026](0026-typescript-local-rules-need-a-runtime-that-imports-them.md) (a local file may be TypeScript where the runtime can import it)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project has local rule files or depends on a prose-gates plugin\n\n#### We prefer\n\nloading both with no config and saying so on every run, over a config that must list them\n\n#### Because\n\na project that depends on a plugin has already chosen it\n\n#### Unless\n\nthe run is on a repository that is not trusted, which --no-plugins is for\n\n## Consequences\n\n### Pros\n\n- A project gains a rule by adding a file or a dependency.\n- A reviewer can see in any log what ran.\n\n### Cons\n\n- Cloning an untrusted repository and running the CLI can run its code, unless --no-plugins is given.\n- A trust prompt or an allow list would close this and is a later record.\n"},"PRS-0023":{"file":"0023-frontmatter-is-a-read-only-view.md","status":"accepted","title":"Frontmatter is a read-only view that built-in rules never see","markdown":"<!-- GENERATED from PRS-0023 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule reads the view through the model it is handed)\n- Depends on [PRS-0001](0001-parse-once-to-mdast.md) (the view is derived from the tree parsed once)\n- Extended by [PRS-0028](0028-frontmatter-edits-are-verified-by-data-equality.md) (a frontmatter edit is now allowed when the data is unchanged)\n- Extended by [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (a paragraph's language view is read on first use too)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule needs the keys and values of a leading metadata block\n\n#### We prefer\n\nthe yaml package, read lazily, exposed as entries with a line and source offsets, over a scanner of our own\n\n#### Because\n\ncorrect ranges for quoted, folded and literal scalars are the yaml package's job\n\n#### Unless\n\na rule needs nested keys or TOML, which calls for a new record\n\n## Consequences\n\n### Pros\n\n- The skills description budget works on a real SKILL.md with one rule file.\n- Frontmatter in a markdown fence is checked like a top-level block, with no extra code.\n\n### Cons\n\n- The package gains its first dependency that is not part of the mdast family.\n- TOML frontmatter and nested keys are out of reach until another record.\n"},"PRS-0024":{"file":"0024-failures-are-named-errors-with-codes.md","status":"accepted","title":"Every deliberate failure is a named error class with a stable code","markdown":"<!-- GENERATED from PRS-0024 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (the config failures it names are the ones the config file can raise)\n- Depended on by [PRS-0025](0025-plugin-loading-strictness.md) (lenient loading branches on the plugin error classes)\n\n## Decision\n\n### The lens\n\n#### Given\n\na run can fail because of the invocation, the config, a plugin source or a plugin fixer\n\n#### We prefer\n\none error class per cause, each with a stable code and the fields a tool needs, over one class with several messages\n\n#### Because\n\na type can be branched on and a message cannot be relied on to stay the same\n\n#### Unless\n\na new cause has no class yet, which means adding one rather than reusing a near match\n\n## Consequences\n\n### Pros\n\n- A wrapper can branch on the type or the code instead of parsing a message.\n- The same codes appear in stderr, in --validate-plugins output and in --json.\n\n### Cons\n\n- A new failure needs a class and a code, which is more to write than a message.\n- A code is public, so renaming one breaks a wrapper.\n"},"PRS-0025":{"file":"0025-plugin-loading-strictness.md","status":"accepted","title":"Strict loading is the default, lenient and validated loading are opt-in and loud","markdown":"<!-- GENERATED from PRS-0025 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0022](0022-plugins-load-automatically.md) (PRS-0022 said there is no skipped plugin, and this makes a skip an explicit choice that is still reported)\n- Depends on [PRS-0024](0024-failures-are-named-errors-with-codes.md) (lenient loading and validation branch on the plugin error classes)\n\n## Decision\n\n### The lens\n\n#### Given\n\na plugin fails to load\n\n#### We prefer\n\nstrict by default, with --lenient-plugins and --validate-plugins as opt-ins that still say what happened, over a silent skip\n\n#### Because\n\na skip that is named is a decision, and a skip that is silent is a bug\n\n#### Unless\n\na project sets pluginLoading to lenient in its config, which is the same choice made once\n\n## Consequences\n\n### Pros\n\n- CI can validate a plugin setup before any document is read.\n- A broken plugin no longer blocks the rest of a team's checks, when they choose that.\n\n### Cons\n\n- A lenient run can pass while a rule did not run, so the stderr line is the only signal and must be read.\n- Lenient loading is not a safety option, because every plugin that loads still runs.\n"},"PRS-0026":{"file":"0026-typescript-local-rules-need-a-runtime-that-imports-them.md","status":"accepted","title":"A local rule may be TypeScript where the runtime can import it","markdown":"<!-- GENERATED from PRS-0026 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0022](0022-plugins-load-automatically.md) (local files are one of the sources discovery finds)\n- Depends on [PRS-0012](0012-node-runs-a-published-bundle.md) (the Node bundle imports the rule with the runtime it is given and uses no Bun global)\n\n## Decision\n\n### The lens\n\n#### Given\n\na local rule is written in TypeScript\n\n#### We prefer\n\nimporting it as it is and requiring a runtime that can, over bundling a transpiler\n\n#### Because\n\nBun and recent Node strip types natively, and a transpiler is a dependency we would own\n\n#### Unless\n\na runtime cannot import TypeScript, which is a named plugin-source error that says how to fix it\n\n## Consequences\n\n### Pros\n\n- A rule can share types and idioms with the project it checks.\n- There is no compiler in the dependency list.\n\n### Cons\n\n- A rule that needs enums or other non-erasable syntax does not run under Node without a flag.\n- Node 20 cannot run a TypeScript rule at all.\n"},"PRS-0027":{"file":"0027-rules-may-be-async.md","status":"accepted","title":"Rules may be async, checks run concurrently, and fixers run in priority order","markdown":"<!-- GENERATED from PRS-0027 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule function may now return a promise)\n- Depends on [PRS-0020](0020-plugin-fixers-stay-under-verification.md) (an async fixer meets the same verification as a sync one)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule may wait, and one invocation should end at a stable text\n\n#### We prefer\n\nasync engines, with concurrent checks and sequential fixers in a hand-kept list, over declared order properties or a staged fold\n\n#### Because\n\nconcurrency is as good as parallelism here, and the restart loop is what makes the result stable\n\n#### Unless\n\nthe cost of asking earlier fixers again becomes real, which calls for a faster loop and a new record\n\n## Consequences\n\n### Pros\n\n- A plugin can call a tool or a service without blocking the other checks.\n- The stable-text guarantee is a property of the loop and is checked by tests.\n\n### Cons\n\n- The library API is async, which changes every caller before the first release.\n- Asking every earlier fixer again after each accepted edit does not scale to hundreds of rules over hundreds of files.\n- Fixers cannot overlap, so a slow fixer delays the ones after it.\n"},"PRS-0028":{"file":"0028-frontmatter-edits-are-verified-by-data-equality.md","status":"accepted","title":"A frontmatter edit is verified by comparing the YAML data before and after","markdown":"<!-- GENERATED from PRS-0028 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (PRS-0023 made frontmatter check-only because no expectation fit, and this adds one that does)\n- Depends on [PRS-0005](0005-every-fix-is-verified.md) (the fingerprint still runs first and a lost word still throws)\n\n## Decision\n\n### The lens\n\n#### Given\n\na fixer rewrites the frontmatter\n\n#### We prefer\n\nan expectation that proves the YAML data is identical and nothing outside it moved, over banning frontmatter fixers or trusting them\n\n#### Because\n\nparsing before and after is a stronger proof than any text comparison, and it is cheap\n\n#### Unless\n\na fixer needs to change the data, which has no expectation and is refused\n\n## Consequences\n\n### Pros\n\n- A plugin can fix frontmatter and the engine proves the data did not change.\n- A rule can reach any string in the YAML without a parser of its own.\n\n### Cons\n\n- The package exposes the yaml package's Document type in its API.\n- Reordering keys is refused, because order is data in the comparison.\n"},"PRS-0029":{"file":"0029-the-docs-site-is-assembled-from-the-real-documents.md","status":"accepted","title":"The docs site is assembled from the real documents and deploys only from main","markdown":"<!-- GENERATED from PRS-0029 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [PRS-0032](0032-the-site-theme-is-a-copy-of-osakanights.md) (the copied theme loads from custom_dir, outside the assembled docs_dir)\n- See also [PRS-0038](0038-example-pages-are-rendered-from-fixtures-and-a-sweep-snapshot.md) (the generated Example Pages are copied into the site like any document)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe documents are gated in place, the records are generated, and main changes only through pull requests\n\n#### We prefer\n\na build step that copies the real documents into an untracked tree, over moving files or tracking a second copy\n\n#### Because\n\nthe copy is rebuilt on every run and never edited, so the gates and the site always read the same words\n\n#### Unless\n\na document needs site-only content, which then lives in the real file as an admonition or a tab\n\n## Consequences\n\n### Pros\n\n- The prose gates keep reading the real files, generated records included.\n- A broken link fails before merge.\n- No document moves, so no existing link or citation breaks.\n\n### Cons\n\n- The site build needs Bun and uv, where a plain MkDocs build needs only Python.\n- A link that leaves the published set must be listed in the assemble script.\n"},"PRS-0030":{"file":"0030-paragraph-length-is-reported-with-topic-guidance.md","status":"accepted","title":"A paragraph over its sentence budget is reported with topic guidance and never autofixed","markdown":"<!-- GENERATED from PRS-0030 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0006](0006-sentence-length-is-never-autofixed.md) (like a long sentence, a long paragraph is reported and never rewritten by a fixer)\n- Extends [PRS-0010](0010-length-findings-guide-a-split.md) (the finding guides a split by counting topics, as the length finding counts clauses)\n- Extends [PRS-0015](0015-a-rule-reads-one-shared-context.md) (a rule may read the findings of the categories it names in after, and its check waits for them)\n- Depends on [PRS-0017](0017-rule-ids-are-category-and-short-name.md) (a new paragraph category gives the rule its first word, since no existing category fits)\n- Depends on [PRS-0018](0018-config-file-and-rule-control.md) (the budget is the maxSentences option, checked at load like maxWords)\n- Depended on by [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (the rule reads the paragraph's language view)\n\n## Decision\n\n### The lens\n\n#### Given\n\na prose paragraph holds more sentences than the budget\n\n#### We prefer\n\na finding that names the topics and breaks after the list rules run, over a bare count\n\n#### Because\n\nthe topics show where the paragraph wants to break, and a promoted list often fixes its length\n\n#### Unless\n\na topic segmenter for JavaScript proves better at finding turns, which would supersede the cohesion scoring only\n\n## Consequences\n\n### Pros\n\n- A finding tells a human or an agent where to break, not only that the paragraph is long.\n- A hidden list is reported once, by the rule whose fixer can promote it, and --fix settles both rules in one run.\n- The guidance is deterministic, with no model, and the language work is done by maintained libraries.\n\n### Cons\n\n- compromise roughly doubles the Node bundle, and make build prints its size.\n- compromise ends a sentence after vs., and keeps a quoted sentence with the next one.\n- compromise tags these and both as plain determiners, so a sentence that opens with them never refers back.\n- parse-english was tried for splitting and dropped.\n  On this repo's one-sentence-per-line docs it merged sentences after a number and before a lower-case word, and compromise never did.\n- Cohesion by shared words misses synonyms, so a topic held together by paraphrase can read as two.\n- A list rule that is on but refuses to fix leaves the paragraph uncounted until a human promotes the list.\n"},"PRS-0031":{"file":"0031-code-complexity-is-gated-by-biome.md","status":"accepted","title":"Code complexity is gated by Biome rules that fail the build","markdown":"<!-- GENERATED from PRS-0031 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0016](0016-modules-group-by-what-a-function-takes.md) (a long function splits into helpers that sit in the layer whose data they read)\n\n## Decision\n\n### The lens\n\n#### Given\n\na function in src or tests is checked by make check\n\n#### We prefer\n\nBiome complexity rules at error level, over warnings or a separate tool\n\n#### Because\n\nBiome already gates the build, and an error is the only level this repo keeps\n\n#### Unless\n\na rule produces findings that no refactor can fix without hiding the logic, which calls for a new record\n\n## Consequences\n\n### Pros\n\n- A long fixer is split into steps a reviewer can check one at a time.\n- The limits are in the one linter the repo already runs, with no new dependency.\n\n### Cons\n\n- Extracting helpers adds functions and names to the larger modules.\n- The limits are numbers, so a function near one may be split where a human would not.\n"},"PRS-0032":{"file":"0032-the-site-theme-is-a-copy-of-osakanights.md","status":"accepted","title":"The docs site wears the OsakaNights theme, copied in from jpai-mermaidjs-lint","markdown":"<!-- GENERATED from PRS-0032 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [PRS-0029](0029-the-docs-site-is-assembled-from-the-real-documents.md) (the theme loads from custom_dir, so it works while the documents are assembled afresh into docs_dir)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sibling repo publishes a reusable MkDocs Material theme folder\n\n#### We prefer\n\na copy of the folder in this repo, over a path into the sibling or a package\n\n#### Because\n\nCI checks out this repo alone, and the theme is not published anywhere it could install from\n\n#### Unless\n\nthe theme is published as a package, which would supersede the copy with a pinned dependency\n\n## Consequences\n\n### Pros\n\n- The site matches its sibling, and builds in CI with nothing outside the repo.\n- A diagram checked for contrast under the mkdocs-material profile reads as it was checked.\n\n### Cons\n\n- The copy can drift from upstream until someone copies it again.\n"},"PRS-0033":{"file":"0033-a-paragraph-carries-a-lazy-language-view.md","status":"accepted","title":"A paragraph carries a language view of its sentences and words, built on first read","markdown":"<!-- GENERATED from PRS-0033 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0023](0023-frontmatter-is-a-read-only-view.md) (the language view is read on first use, as the frontmatter view is)\n- Extends [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule reads the view from the paragraphs it already receives, with no import)\n- Depends on [PRS-0030](0030-paragraph-length-is-reported-with-topic-guidance.md) (the paragraph rule is the first reader, and its libraries are pinned there)\n- Depended on by [PRS-0034](0034-clauses-count-verb-phrases-as-well-as-markers.md) (the length rule reads sentences and verb phrases from the view)\n- Extended by [PRS-0036](0036-a-glossary-is-read-as-the-concept-model.md) (each sentence of the view lists the concepts of the project it names)\n- Extended by [PRS-0039](0039-a-text-carries-a-lazy-language-view.md) (every text view carries the same lazy language view)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule wants the sentences, words, tags or lemmas of a paragraph\n\n#### We prefer\n\na lazy language view on ParagraphView, over each rule tagging its own copy\n\n#### Because\n\none view is computed at most once per paragraph, and every rule reads the same answer\n\n#### Unless\n\na rule needs language data across paragraphs, which calls for a document-level view and a new record\n\n## Consequences\n\n### Pros\n\n- A plugin can write a language rule without adding a tagger of its own.\n- A document that no language rule reads is never tagged.\n\n### Cons\n\n- compromise's tags become part of what a plugin can rely on, so a tag change on upgrade can move a plugin's findings.\n- A view built per paragraph cannot see a sentence that a paragraph break interrupts.\n"},"PRS-0034":{"file":"0034-clauses-count-verb-phrases-as-well-as-markers.md","status":"accepted","title":"The clause count is the larger of the marker count and the verb phrases compromise finds","markdown":"<!-- GENERATED from PRS-0034 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0010](0010-length-findings-guide-a-split.md) (the finding still reports potential clauses, and the count now reads verbs as well as markers)\n- Depends on [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (the rule reads each sentence, with its verb phrases, from the paragraph's language view)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence exceeds the word budget and the finding estimates its clauses\n\n#### We prefer\n\nthe larger of the marker count and compromise's verb phrases, over either alone\n\n#### Because\n\nverbs find the clauses that markers miss, and markers hold up the count where the tagger misses a verb\n\n#### Unless\n\na dependency parser that runs in JavaScript proves deterministic, which would replace both signals\n\n## Consequences\n\n### Pros\n\n- On the probe sentences the combined count matched a careful reading in 9 of 11 cases, against 7 for markers alone.\n- A series of verbs, the commonest long sentence in technical prose, now asks for a split per verb.\n\n### Cons\n\n- compromise misses some verbs, such as reparses, so a clause joined with no marker can still go uncounted.\n- The Oxford comma in a list still reads as a boundary, because core compromise has no list detection.\n"},"PRS-0035":{"file":"0035-finding-messages-are-measured-by-agent-evals.md","status":"accepted","title":"Finding messages are measured by agent evals that never gate the build","markdown":"<!-- GENERATED from PRS-0035 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0010](0010-length-findings-guide-a-split.md) (the clause guidance a length finding gives is now measured against agents that follow it)\n- Depends on [PRS-0006](0006-sentence-length-is-never-autofixed.md) (the evals target rules with no fixer, where only a rewrite clears the finding)\n- See also [PRS-0037](0037-a-check-reports-every-line-its-fixer-changes.md) (a sweep found the one-per-line check passing what its fixer rewrote)\n- Depended on by [PRS-0038](0038-example-pages-are-rendered-from-fixtures-and-a-sweep-snapshot.md) (the agent evals page is rendered from a kept sweep)\n\n## Decision\n\n### The lens\n\n#### Given\n\na rule whose finding needs a rewrite, and an agent asked to clear it with the messages as its only guidance\n\n#### We prefer\n\nbilled evals run on demand, graded by the gates and by content preservation, over judging messages by reading them\n\n#### Because\n\nthe pass rate and the turn count show which wording closes the loop, and a deterministic grader keeps the measure honest\n\n#### Unless\n\na live run becomes cheap and keyless enough to gate a pull request, which would call for a new record\n\n## Consequences\n\n### Pros\n\n- A message change can be shown to cut turns or raise the pass rate before it ships.\n- The gates stay free of any model, since the agent only ever reads their output.\n\n### Cons\n\n- A live run costs money and needs credentials for each harness in the matrix.\n- Model behaviour drifts over time, so a sweep is only comparable with sweeps run close to it.\n"},"PRS-0036":{"file":"0036-a-glossary-is-read-as-the-concept-model.md","status":"accepted","title":"A project's GLOSSARY.md or CONCEPTS.md is read as its concept model, and the language view names its terms","markdown":"<!-- GENERATED from PRS-0036 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (each sentence of the language view now lists the concepts it names)\n- Extends [PRS-0018](0018-config-file-and-rule-control.md) (a second file at the project root shapes a run, beside the config, and fails the same way when it is wrong)\n- Extends [PRS-0019](0019-plugin-contract-and-namespace.md) (a plugin rule reads concepts from the document it already receives, with no import)\n- Extended by [PRS-0040](0040-a-run-can-leave-the-concept-file-unread.md) (a run with --no-concepts leaves the file unread)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project keeps a glossary in the librarian template, one H2 per term and Mermaid diagrams that relate them\n\n#### We prefer\n\nreading that file as the concept model and naming its terms in the language view, over a separate vocabulary config\n\n#### Because\n\nthe glossary is already the canonical vocabulary, so a second copy would drift from it\n\n#### Unless\n\na project needs concepts from several files or from outside the root, which calls for a config key and a new record\n\n## Consequences\n\n### Pros\n\n- A plugin can check a project's own dialect, such as Title Case terms or a prohibited relation, from data alone.\n- A glossary diagram that names an undefined term now fails the run, so the diagram and the headings stay in step.\n\n### Cons\n\n- A project whose GLOSSARY.md is in another shape must move it to the template before the gates run there.\n- Findings of a concept rule depend on a file other than the one checked, so a glossary edit can move them.\n"},"PRS-0037":{"file":"0037-a-check-reports-every-line-its-fixer-changes.md","status":"accepted","title":"sentence-one-per-line reports several sentences on one line, as its fixer splits them","markdown":"<!-- GENERATED from PRS-0037 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0005](0005-every-fix-is-verified.md) (beyond a verified fix, a fix never touches a paragraph the check passed)\n- Depends on [PRS-0009](0009-adversarial-and-property-tests-gate-fixes.md) (the adversarial test that reproduces the gap came before the fix)\n- See also [PRS-0035](0035-finding-messages-are-measured-by-agent-evals.md) (the eval sweep is how the gap was found)\n- Depends on [PRS-0002](0002-generated-markdown-is-gated.md) (generated record markdown failed the stricter check, so the template was fixed at its source)\n- See also [PRS-0041](0041-a-comma-run-of-code-spans-is-a-hidden-list.md) (list-comma-code-run reports runs its fix refuses, the other half of keeping check and fix in step)\n\n## Decision\n\n### The lens\n\n#### Given\n\na check that reported only a sentence wrapped across lines, beside a fixer that splits every sentence onto its own line\n\n#### We prefer\n\na check that also reports a line holding several sentences, by the same sentence rule the fixer uses, over a fixer narrowed to wraps\n\n#### Because\n\none sentence per line is the rule's name and its fix, and a check that passes what --fix rewrites leaves a clean file unstable\n\n#### Unless\n\na fixer refuses a case the check reports, such as a hard break or a blockquote, which leaves the finding for a human\n\n## Consequences\n\n### Pros\n\n- A file that passes the gate is a fixed point of --fix for this rule.\n- Agents that pack sentences onto one line now get a finding, not a silent pass.\n\n### Cons\n\n- An abbreviation before a capital, such as Dr.\n  Smith, is reported, as the fixer already split it.\n- Every bundle rendered by the old template fails until its repo upgrades jpai-meta-cli and regenerates.\n"},"PRS-0038":{"file":"0038-example-pages-are-rendered-from-fixtures-and-a-sweep-snapshot.md","status":"accepted","title":"The Example Pages are rendered from the golden fixtures and a committed Sweep Snapshot","markdown":"<!-- GENERATED from PRS-0038 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0002](0002-generated-markdown-is-gated.md) (the generated pages are gated like every other markdown file)\n- Depends on [PRS-0035](0035-finding-messages-are-measured-by-agent-evals.md) (the agent rewrites come from the live eval sweep)\n- See also [PRS-0029](0029-the-docs-site-is-assembled-from-the-real-documents.md) (the site copies the generated pages like any other document)\n\n## Decision\n\n### The lens\n\n#### Given\n\ngolden fixtures the tests already hold to the code, and an eval cache that git ignores and every sweep replaces\n\n#### We prefer\n\npages rendered from the fixtures and from a committed snapshot of one sweep, over examples written by hand\n\n#### Because\n\na hand-written example drifts silently, while a rendered one shows the gate as it is today and fails a test when stale\n\n#### Unless\n\na sweep is too costly to repeat, which leaves the snapshot older than the rules, as the page says\n\n## Consequences\n\n### Pros\n\n- Every finding on an Example Page is the gate's output at render time.\n- A rule that tightens after a sweep shows as findings on the old rewrites.\n\n### Cons\n\n- The snapshot is a dated copy, so its rewrites age until the next sweep is kept.\n- Agent messages are published, so the snapshot must strip local paths before it is committed.\n"},"PRS-0039":{"file":"0039-a-text-carries-a-lazy-language-view.md","status":"accepted","title":"A text view carries the same lazy language view as a paragraph","markdown":"<!-- GENERATED from PRS-0039 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0033](0033-a-paragraph-carries-a-lazy-language-view.md) (the paragraph's lazy language view, given to every text node too)\n\n## Decision\n\n### The lens\n\n#### Given\n\na language view on each paragraph, and text views for every prose text node, headings and table cells included\n\n#### We prefer\n\nthe same lazy language view on each text view, read from its value, over a separate helper a rule must import\n\n#### Because\n\na rule reads one shape on either view, and a text no rule asks about is never tagged\n\n#### Unless\n\na rule needs whole sentences, which only a paragraph's language holds, since emphasis or a link splits a text\n\n## Consequences\n\n### Pros\n\n- A rule can read a heading's words and tags with no paragraph to read them from.\n- Plugins get the view with no import, like the paragraph's.\n\n### Cons\n\n- A text view is a fragment, so its sentences end wherever inline markup starts.\n- Reading every text's language tags the prose a second time beside the paragraph's.\n"},"PRS-0040":{"file":"0040-a-run-can-leave-the-concept-file-unread.md","status":"accepted","title":"A run with --no-concepts leaves the concept file unread","markdown":"<!-- GENERATED from PRS-0040 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0036](0036-a-glossary-is-read-as-the-concept-model.md) (the concept file stays read by default, and this flag is the way out its cons named)\n\n## Decision\n\n### The lens\n\n#### Given\n\na concept file at the project root is read on every run, and one in another shape stops the run\n\n#### We prefer\n\na --no-concepts flag that leaves the file unread, over a fixed name list or a rule to move the file\n\n#### Because\n\nthe glossary may serve readers in a shape the gates do not parse, and the run should not force it to change\n\n#### Unless\n\na project needs this on every run, which calls for a config key and a new record\n\n## Consequences\n\n### Pros\n\n- A repo with a free-form glossary can run every built-in rule today.\n- The flag mirrors --no-plugins, so it reads as the same kind of switch.\n\n### Cons\n\n- A concept rule under the flag sees no concepts, so it finds nothing rather than failing.\n- The opt-out lives on the command line, so each caller has to pass it.\n"},"PRS-0041":{"file":"0041-a-comma-run-of-code-spans-is-a-hidden-list.md","status":"accepted","title":"A comma-joined run of three or more inline code spans is a hidden list, and plain words stay prose","markdown":"<!-- GENERATED from PRS-0041 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0004](0004-a-fixer-refuses-when-unsure.md) (a run mid-sentence, without a lead-in, or opening inside a link or emphasis is refused)\n- See also [PRS-0037](0037-a-check-reports-every-line-its-fixer-changes.md) (the check reports runs the fix refuses, so a refused run stays reported rather than silently passing)\n- Extended by [PRS-0042](0042-plain-word-runs-and-a-min-items-option.md) (list-comma-plain-run reports long plain-word runs, and minItems tunes this rule's threshold)\n\n## Decision\n\n### The lens\n\n#### Given\n\ncomma-joined items that are each only an inline code span, with an optional \"and\" or \"or\" before the last\n\n#### We prefer\n\na list rule for code-span runs only, over one for any series of plain words\n\n#### Because\n\na scan of this repo's docs found 40 plain-word series, all ordinary English, against 15 code-span runs, all real lists\n\n#### Unless\n\na plain-word list can be told from a series by its words alone, which calls for a new record and its own rule\n\n## Consequences\n\n### Pros\n\n- A run of file names, flags or keys becomes a list a reader can scan.\n- Labelled runs stay with list-comma-labelled-run, because a code span followed by content is no bare item.\n\n### Cons\n\n- A bare list of plain words, such as service names without backticks, still passes.\n- A run mid-sentence is reported with no fix, so the author rewrites it by hand.\n"},"PRS-0042":{"file":"0042-plain-word-runs-and-a-min-items-option.md","status":"accepted","title":"A run of five or more plain-word items is a hidden list, and every run rule takes a minItems option","markdown":"<!-- GENERATED from PRS-0042 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [PRS-0041](0041-a-comma-run-of-code-spans-is-a-hidden-list.md) (the plain-word list its unless clause left for a new record, told from a series by its length)\n- Extends [PRS-0018](0018-config-file-and-rule-control.md) (minItems is a rule option in the existing config, checked like maxWords and maxSentences)\n\n## Decision\n\n### The lens\n\n#### Given\n\nplain-word series are mostly ordinary English, and a long one is mostly a list\n\n#### We prefer\n\na plain-word run rule at five items by default, and a minItems option on every run rule\n\n#### Because\n\nlength is what tells a list from a series, and where that line sits is each project's call\n\n#### Unless\n\na project needs a different threshold per file, which calls for overrides and a new record\n\n## Consequences\n\n### Pros\n\n- A list of service names or channels without backticks is now reported once it is long.\n- A project can tune each run rule up or down without switching it off.\n\n### Cons\n\n- Without a colon the first item is never counted, so the rule can report a run one item late.\n- An interpunct run below the flat rule's minItems goes back to punctuation-interpunct-in-prose, so raising it can turn list findings into glyph findings.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle
  // only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived
  // rather than assigned: fill is the group, size is in-degree (how many records
  // refine or supersede this one). Status rides on the border, because usually only
  // a couple of records are superseded and a whole colour channel would be wasted.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its group colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // A status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"], node[status = "retired"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: 'node[status = "proposed"]',
        style: { "border-width": 2, "border-color": css("muted"), "border-opacity": 1, "border-style": "dotted" },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
