    target: PRS-0018
    note: plugin rules join the registry and answer to the same config
  - relation: depends_on
    target: PRS-0008
    note: a plugin rule is the same unit, a check with an optional fix
  - relation: depends_on
    target: PRS-0017
    note: a rule key is category-short-name and the id adds the namespace in front
  - relation: depended_on_by
    target: PRS-0020
    note: fixers from a plugin are held to the same proof
  - relation: depended_on_by
